# Nexora Futur (Ref #652, #653) — site Netlify « nexora-futur ».
[build]
  command = "npm run build"
  publish = "dist"
  # Même commande ignore que les autres sites : construit en production à
  # chaque fusion dans main si apps/nexora-futur a changé ; previews et branch
  # deploys toujours sautés (le site reçoit des secrets de production).
  ignore = "node ../../scripts/netlify-ignore.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[context.production.environment]
  NEXORA_ENV = "production"

# Application monopage : toute adresse sert index.html (adresses par lentille).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Firebase Auth (popup Google et e-mail) et Firestore uniquement.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://nexora-cb20d.firebaseapp.com wss://*.firebaseio.com; frame-src https://nexora-cb20d.firebaseapp.com https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
