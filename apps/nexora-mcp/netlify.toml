[build]
  publish = "public"
  # Garde-fou versionné (Ref #544) : aucun build Git ne publie plus la
  # production. Elle se publie par `outils/publier production`, après feu vert
  # explicite ; les builds Git sont en outre arrêtés dans Netlify. Code de
  # sortie 0 = construction sautée. Détails et restauration de l'ancien
  # fonctionnement : scripts/netlify-ignore.mjs et docs/PUBLICATION.md.
  ignore = "node ../../scripts/netlify-ignore.mjs"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Contextes explicites (Ref #544). Les variables sensibles restent dans
# Netlify ; aucun contexte ne doit servir de préproduction intégrée tant que
# les secrets de production y sont hérités (voir docs/PUBLICATION.md).
[context.production.environment]
  NEXORA_ENV = "production"

[context.deploy-preview.environment]
  NEXORA_ENV = "preproduction"

[context.branch-deploy.environment]
  NEXORA_ENV = "preproduction"
