[build]
  publish = "public"
  # Ne construire ce site QUE si son propre dossier a changé.
  #
  # Les deux sites vivent dans le même dépôt : sans cette règle, un correctif
  # d'interface reconstruisait AUSSI le site MCP, et inversement — deux
  # constructions facturées là où une seule était utile.
  #
  # Netlify exécute cette commande depuis le base directory : « . » désigne donc
  # ce dossier-ci. Code de sortie 0 = rien n'a changé, on saute la construction ;
  # non nul = on construit. Au premier build ou après un vidage de cache,
  # $CACHED_COMMIT_REF est vide, la commande échoue, et la construction a lieu —
  # le repli sûr est bien « construire ».
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
