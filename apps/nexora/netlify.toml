[build]
  command = "npm run build"
  publish = "dist"
  # Commande ignore commune (Ref #544, #553) : chaque fusion dans main publie
  # la production si les fichiers du site ont changé ; previews et branch
  # deploys toujours sautés. Code de sortie 0 = construction sautée. Détails
  # et arrêt d'urgence : scripts/netlify-ignore.mjs et docs/PUBLICATION.md.
  ignore = "node ../../scripts/netlify-ignore.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/nexora/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

# Contextes explicites (Ref #544). Les variables sensibles restent dans
# Netlify ; aucun contexte ne doit servir de préproduction intégrée tant que
# les secrets de production y sont hérités (voir docs/PUBLICATION.md).
[context.production.environment]
  NEXORA_ENV = "production"

[context.deploy-preview.environment]
  NEXORA_ENV = "preproduction"

[context.branch-deploy.environment]
  NEXORA_ENV = "preproduction"
