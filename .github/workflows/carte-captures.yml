name: Captures Carte 3D
on:
  push:
    branches: ['codex/carte-captures-517']
permissions:
  contents: read
jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix apps/nexora && npm run build --prefix apps/nexora
      - run: npm ci --prefix tools/visual-check
      - run: npm install --no-save --package-lock=false --prefix tools/visual-check playwright@1.51.1
      - run: tools/visual-check/node_modules/.bin/playwright install --with-deps chromium
      - run: node tools/visual-check/capture-carte.mjs
        env:
          PRODUCTION_COMMIT: 7f66e253782c45b513caea0695aeafba09c0cc96
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexora-carte-3d-captures
          path: captures-carte/
          if-no-files-found: error
          retention-days: 7
