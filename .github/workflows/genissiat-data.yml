name: Génissiat — données réelles

# Télécharge le relief et l'orthophoto IGN (Géoplateforme) et les implantations
# OpenStreetMap (Overpass) avec genissiat/tools/prepare_data.py, puis committe les
# fichiers produits (genissiat/data/*) sur la branche. Ne touche à aucun site Netlify.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - genissiat/tools/prepare_data.py
      - genissiat/tools/requirements.txt
      - .github/workflows/genissiat-data.yml

permissions:
  contents: write

concurrency:
  group: genissiat-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: genissiat/tools/requirements.txt
      - run: pip install -r genissiat/tools/requirements.txt
      - run: python genissiat/tools/prepare_data.py
      - name: Committer les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add genissiat/data/terrain.json genissiat/data/ortho.jpg genissiat/data/osm.json genissiat/data/report.json
          if git diff --cached --quiet; then echo "Données inchangées."; exit 0; fi
          git commit -m "Génissiat : données IGN et OSM régénérées par prepare_data.py"
          git push
