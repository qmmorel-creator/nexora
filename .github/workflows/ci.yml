name: Nexora CI

on:
  pull_request:
  push:
    # Les branches de travail sont vérifiées ici plutôt qu'à l'ouverture d'une
    # pull request : une pull request déclenche une construction Netlify FACTURÉE
    # sur chaque site, alors que GitHub Actions ne coûte rien sur un dépôt public.
    # Le travail peut donc s'accumuler et rester vérifié, sans déployer.
    branches: [main, 'claude/**', 'codex/**']

# Une seule exécution par référence : une branche qui finit par recevoir une
# pull request ne paie pas deux fois la même vérification.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/nexora/package-lock.json
            apps/nexora-mcp/package-lock.json
      - run: npm run install:all
      - run: npm run verify

