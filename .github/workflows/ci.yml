name: Nexora CI

on:
  pull_request:
  push:
    # Les branches de travail sont vérifiées ici plutôt qu'à l'ouverture d'une
    # pull request : une pull request déclenche une construction Netlify FACTURÉE
    # sur chaque site, alors que GitHub Actions ne coûte rien sur un dépôt public.
    # Le travail peut donc s'accumuler et rester vérifié, sans déployer.
    branches: [main, 'claude/**', 'codex/**']

# Une seule exécution à la fois par branche (push) ou par pull request : un
# nouveau push annule la vérification devenue obsolète. Le run `push` d'une
# branche et le run `pull_request` de sa PR restent distincts : le second
# vérifie le commit de fusion avec `main`, pas seulement la branche. Les deux
# sont gratuits (dépôt public, runner standard).
# Le banc visuel (tools/visual-check) ne tourne pas ici : voir son README.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/nexora/package-lock.json
            apps/nexora-mcp/package-lock.json
      - run: npm run install:all
      - run: npm run verify

