name: "Demande d'amélioration / nouvelle fonctionnalité"
description: Signaler un problème, demander une amélioration ou une nouvelle fonctionnalité sur Nexora.
title: "[Zone] Résumé court de la demande"
labels: ["statut:backlog"]
body:
  - type: dropdown
    id: zone
    attributes:
      label: Zone concernée
      options:
        - Interface Nexora
        - Tâches & projets
        - Rapports & briefs
        - MCP ChatGPT
        - Intégrations (Todoist, Google)
        - Finance
        - API & automatisations
        - Déploiement / CI
        - Design / esthétique
        - Autre
    validations:
      required: true

  - type: textarea
    id: contexte
    attributes:
      label: Contexte
      description: Qu'est-ce qui ne va pas, ou qu'est-ce que tu essaies de faire ?
      placeholder: "Ex. Dans le mini-Gantt, quand je regroupe par projet..."
    validations:
      required: true

  - type: textarea
    id: attendu
    attributes:
      label: Comportement attendu
      description: À quoi ça devrait ressembler / comment ça devrait se comporter une fois corrigé ?
    validations:
      required: true

  - type: textarea
    id: captures
    attributes:
      label: Captures d'écran
      description: Glisse-dépose une ou plusieurs images ici (avant/après si pertinent).
    validations:
      required: false

  - type: dropdown
    id: priorite
    attributes:
      label: Priorité
      options:
        - Bloquant
        - Important
        - Confort
      default: 2
    validations:
      required: true
