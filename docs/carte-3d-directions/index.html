<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte 3D : directions de rendu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Inter:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<!--
  Maquettes de rendu de la vue Carte (Nexora) : trois directions visuelles
  sur la même carte (mêmes territoires, mêmes tâches, mêmes états).
    ?d=A  Diorama doux (façon Dorfromantik)
    ?d=B  Pastel architectural (façon Townscaper)
    ?d=C  Cartoon vivant (façon Animal Crossing)
  Rien ici n'est branché sur Nexora : c'est une maquette autonome.
-->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
} }
</script>
<style>
  :root { --ink:#18263d; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#dfe9ef; font-family:Inter, -apple-system, "Segoe UI", sans-serif; color:var(--ink); overflow:hidden; }
  #stage { position:fixed; inset:0; }
  #stage canvas { display:block; width:100%; height:100%; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  .tabs { position:fixed; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:6px; pointer-events:auto; z-index:5; }
  .tabs a { text-decoration:none; font-weight:700; font-size:13px; color:var(--ink); background:rgba(255,255,255,.9); border:1px solid rgba(24,38,61,.15); border-radius:999px; padding:7px 14px; }
  .tabs a.on { background:var(--ink); color:#fff; }
  .caption { position:fixed; right:16px; bottom:16px; max-width:360px; font-size:12.5px; line-height:1.45; background:rgba(255,255,255,.9); border-radius:12px; padding:10px 12px; box-shadow:0 4px 16px rgba(24,38,61,.15); }
  .caption b { display:block; font-size:14px; margin-bottom:2px; }
  .ribbon { position:absolute; top:14px; left:16px; display:flex; gap:10px; }
  .badge { width:58px; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .badge i { width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-weight:800; }
  .badge small { font-size:10.5px; font-weight:700; padding:0 5px; border-radius:5px; white-space:nowrap; }
  .res { position:absolute; top:92px; left:16px; display:flex; gap:2px; padding:3px; }
  .res span { display:flex; gap:5px; align-items:baseline; padding:4px 9px; font-size:11.5px; font-weight:600; }
  .res b { font-size:15px; font-weight:800; }
  .lbl { position:absolute; transform:translate(-50%,-100%); white-space:nowrap; }
  .lbl-p { display:flex; align-items:center; gap:6px; padding:5px 11px 5px 8px; font-size:12.5px; font-weight:700; }
  .lbl-p .dot { width:10px; height:10px; border-radius:3px; }
  .lbl-p em { font-style:normal; font-weight:600; font-size:11.5px; opacity:.75; border-left:1px solid currentColor; padding-left:6px; }
  .lbl-p em b { color:#c62828; }
  .lbl-t { display:flex; align-items:center; gap:6px; padding:3px 9px; font-size:11.5px; font-weight:600; }
  .lbl-t .st { width:8px; height:8px; border-radius:50%; }
  .lbl-t b { color:#ffd23f; }

  /* A — diorama doux : cartes de papier, serif italique pour les lieux. */
  .A .badge i { background:conic-gradient(#d9a441 calc(var(--p)*1%), rgba(255,250,235,.7) 0); box-shadow:0 3px 10px rgba(60,40,10,.25); }
  .A .badge i::after { content:attr(data-n); position:absolute; }
  .A .badge small, .A .res, .A .lbl-p { background:rgba(252,247,234,.95); border:1px solid rgba(110,80,40,.25); color:#3b2a14; }
  .A .res { border-radius:12px; box-shadow:0 3px 12px rgba(60,40,10,.18); }
  .A .lbl-p { border-radius:10px; font-family:"Cormorant Garamond", Georgia, serif; font-style:italic; font-size:16px; box-shadow:0 3px 10px rgba(60,40,10,.2); }
  .A .lbl-p em { font-family:Inter, sans-serif; font-style:normal; }
  .A .lbl-t { background:rgba(59,42,20,.86); color:#fff7e6; border-radius:8px; }
  /* B — pastel : pastilles blanches nettes, ombres longues et douces. */
  .B .badge i { background:conic-gradient(#8fb8ff calc(var(--p)*1%), rgba(255,255,255,.75) 0); box-shadow:0 6px 16px rgba(70,90,140,.22); }
  .B .badge small, .B .res, .B .lbl-p { background:rgba(255,255,255,.96); border:none; color:#2d3a55; box-shadow:0 6px 18px rgba(70,90,140,.18); }
  .B .res { border-radius:14px; }
  .B .lbl-p { border-radius:999px; }
  .B .lbl-t { background:rgba(255,255,255,.96); color:#2d3a55; border-radius:999px; box-shadow:0 4px 12px rgba(70,90,140,.2); }
  .B .lbl-t b { color:#e07b1a; }
  /* C — cartoon : bulles épaisses, contour marqué, police ronde. */
  .C { font-family:Fredoka, Inter, sans-serif; }
  .C .badge i { background:conic-gradient(#ffc93c calc(var(--p)*1%), #fff 0); border:3px solid #2b2140; box-shadow:0 4px 0 #2b2140; }
  .C .badge small, .C .res, .C .lbl-p, .C .lbl-t { background:#fffdf5; border:3px solid #2b2140; color:#2b2140; box-shadow:0 4px 0 #2b2140; }
  .C .res { border-radius:16px; }
  .C .lbl-p { border-radius:16px; font-size:14px; }
  .C .lbl-t { border-radius:12px; font-size:12px; }
  .C .lbl-t b { color:#e56b1f; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui"></div>
<nav class="tabs" id="tabs"></nav>
<div class="caption" id="caption"></div>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const params = new URLSearchParams(location.search);
const D = ["A", "B", "C"].includes(params.get("d")) ? params.get("d") : "A";
const STILL = params.has("still");
const INFO = {
  A: ["Diorama doux", "Façon Dorfromantik. Îles posées sur des falaises de terre en strates, tuiles biseautées, herbe en dégradé, bosquets ronds, toits de tuiles, eau turquoise et écume le long des rives, lumière dorée d'après-midi."],
  B: ["Pastel architectural", "Façon Townscaper. Maisons modulaires en hauteur, arches, fenêtres cintrées, teintes pastel tirées de la couleur de chaque projet, quais de pierre, liseré encré fin, ciel de matin et reflets sur l'eau."],
  C: ["Cartoon vivant", "Façon Animal Crossing. Ombrage en trois tons, contours épais, formes rondes et joufflues, monde légèrement courbé comme une petite planète, nuages et fumées de dessin animé."],
};
document.body.classList.add(D);
document.getElementById("tabs").innerHTML = ["A", "B", "C"].map((k) => `<a href="?d=${k}" class="${k === D ? "on" : ""}">${k} · ${INFO[k][0]}</a>`).join("");
document.getElementById("caption").innerHTML = `<b>${D} · ${INFO[D][0]}</b>${INFO[D][1]}`;
if (STILL) { document.getElementById("tabs").style.display = "none"; document.getElementById("caption").style.display = "none"; }

// ---------- Outils ----------
const SQ3 = Math.sqrt(3);
const hw = (q, r) => ({ x: SQ3 * (q + r / 2), z: 1.5 * r });
const hdist = (a, b) => (Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[0] + a[1] - b[0] - b[1])) / 2;
const key = (q, r) => q + "," + r;
function rnd(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; }
const mix = (a, b, t) => new THREE.Color(a).lerp(new THREE.Color(b), t);
const hex = (c) => "#" + new THREE.Color(c).getHexString();

// ---------- Données : la même carte pour les trois directions ----------
const TERR = [
  { id: "lot", name: "Lot 2B", color: "#8b5cf6", c: [0, 0], R: 2, pct: 14, late: 6 },
  { id: "pass", name: "Passerelle quai Nord", color: "#e07b1a", c: [4, 1], R: 2, pct: 25, late: 2 },
  { id: "jardin", name: "Jardin", color: "#22a06b", c: [-4, 6], R: 2, pct: 60, late: 1 },
  { id: "phare", name: "Communication", color: "#2e86ab", c: [6, -4], R: 1, pct: 0, late: 0 },
];
// [territoire, dq, dr, type, avancement, titre]
const TASKS = [
  ["lot", 1, -1, "done", 100, "Point budget hebdo"],
  ["lot", -1, 0, "build", 60, "Revue DOE"],
  ["lot", 1, -2, "fire", 30, "Réserves Lot 2B"],
  ["lot", -2, 1, "late", 0, "Réunion de chantier 2"],
  ["lot", 2, -1, "fog", 0, "Demande lame piste"],
  ["lot", -1, -1, "done", 100, "Récolement DREAL"],
  ["pass", -1, 1, "done", 100, "Plan de levage"],
  ["pass", 1, -1, "milestone", 70, "Mise en service"],
  ["pass", 2, -1, "wait", 40, "Validation client"],
  ["pass", -2, 1, "todo", 0, "Commande garde-corps"],
  ["pass", 1, 1, "build", 30, "Tablier"],
  ["jardin", 1, -1, "done", 100, "Plantations"],
  ["jardin", -1, 1, "build", 40, "Allées"],
  ["jardin", 1, 0, "todo", 0, "Arrosage auto"],
  ["phare", 0, 0, "lighthouse", 100, "Séminaire PCH"],
];
const ROAD_DIRS = [[1, 0], [0, 1]];
const tiles = new Map();
TERR.forEach((t) => {
  for (let dq = -t.R; dq <= t.R; dq++) for (let dr = -t.R; dr <= t.R; dr++) {
    if (hdist([0, 0], [dq, dr]) > t.R) continue;
    const q = t.c[0] + dq, r = t.c[1] + dr;
    const road = t.R > 1 && ROAD_DIRS.some(([a, b]) => (dq === a && dr === b) || (dq === 2 * a && dr === 2 * b));
    tiles.set(key(q, r), { q, r, terr: t, hub: dq === 0 && dr === 0, road, kind: "land", h: 0.42 + rnd("h" + q + r) * 0.14 });
  }
  // Rivage sauvage autour du territoire.
  for (let dq = -t.R - 1; dq <= t.R + 1; dq++) for (let dr = -t.R - 1; dr <= t.R + 1; dr++) {
    if (hdist([0, 0], [dq, dr]) !== t.R + 1) continue;
    const q = t.c[0] + dq, r = t.c[1] + dr;
    if (tiles.has(key(q, r)) || rnd("w" + q + r) < 0.72) continue;
    tiles.set(key(q, r), { q, r, terr: null, kind: "wild", h: 0.3 + rnd("h" + q + r) * 0.1 });
  }
});
const taskAt = new Map();
TASKS.forEach(([tid, dq, dr, type, pct, title]) => {
  const t = TERR.find((x) => x.id === tid);
  taskAt.set(key(t.c[0] + dq, t.c[1] + dr), { type, pct, title, terr: t });
});

// ---------- Rendu ----------
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setSize(W, H);
renderer.shadowMap.enabled = D !== "C";
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = D === "C" ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = D === "A" ? 1.05 : 0.95;
document.getElementById("stage").appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(D === "C" ? 32 : 28, W / H, 0.5, 400);

// Ciel en dégradé : fond et éclairage d'environnement (reflets de l'eau).
function skyTexture(top, mid, bottom) {
  const c = document.createElement("canvas"); c.width = 4; c.height = 256;
  const g = c.getContext("2d"); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, top); gr.addColorStop(0.55, mid); gr.addColorStop(1, bottom);
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const SKY = { A: ["#8ec5e8", "#cfe6ef", "#f6e7c8"], B: ["#8fb6ea", "#d4e2f4", "#f8dcd4"], C: ["#62c8f5", "#9fe0fb", "#d8f6ff"] }[D];
scene.background = skyTexture(...SKY);
{
  const envScene = new THREE.Scene();
  const sph = new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.MeshBasicMaterial({ map: skyTexture(...SKY), side: THREE.BackSide }));
  envScene.add(sph);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(envScene, 0.04).texture;
}
scene.fog = new THREE.Fog(SKY[1], 55, 120);

// Lumières.
const hemi = new THREE.HemisphereLight(SKY[0], D === "A" ? "#8a7a55" : "#b9b2c9", D === "C" ? 0.75 : 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(D === "A" ? "#ffdcaa" : D === "B" ? "#fff3e6" : "#ffffff", D === "A" ? 3.2 : D === "B" ? 2.0 : 1.35);
sun.position.set(D === "A" ? 26 : 18, D === "A" ? 22 : 34, D === "A" ? 10 : 18);
sun.castShadow = D !== "C";
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 120 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);
const center = new THREE.Vector3();
{ let n = 0; tiles.forEach((t) => { const w = hw(t.q, t.r); center.x += w.x; center.z += w.z; n++; }); center.divideScalar(n); }
sun.target.position.copy(center); scene.add(sun.target);
sun.position.add(center);

// ---------- Matériaux par direction ----------
const toonRamp = (() => { const d = new Uint8Array([95, 165, 225]); const t = new THREE.DataTexture(d, 3, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const bendU = { uBend: { value: D === "C" ? 0.0042 : 0 }, uBendC: { value: new THREE.Vector2(center.x, center.z) } };
function bendify(m, thick) {
  if (D !== "C" && !thick) return m;
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uBend = bendU.uBend; sh.uniforms.uBendC = bendU.uBendC; sh.uniforms.uThick = { value: thick || 0 };
    sh.vertexShader = "uniform float uBend; uniform vec2 uBendC; uniform float uThick;\n" + sh.vertexShader.replace("#include <project_vertex>", `
      vec4 mvPosition = vec4( transformed + normal * uThick, 1.0 );
      #ifdef USE_INSTANCING
        mvPosition = instanceMatrix * mvPosition;
      #endif
      vec4 wpos = modelMatrix * mvPosition;
      float dd = distance(wpos.xz, uBendC);
      wpos.y -= dd * dd * uBend;
      mvPosition = viewMatrix * wpos;
      gl_Position = projectionMatrix * mvPosition;`);
  };
  m.customProgramCacheKey = () => "bend" + (thick || 0);
  return m;
}
const matCache = new Map();
function mat(color, o = {}) {
  const k = hex(color) + JSON.stringify(o);
  if (matCache.has(k)) return matCache.get(k);
  let m;
  if (D === "C") m = new THREE.MeshToonMaterial({ color, gradientMap: toonRamp, emissive: o.glow ? color : "#000000", emissiveIntensity: o.glow ? 0.9 : 0, vertexColors: !!o.vc, transparent: !!o.opacity, opacity: o.opacity || 1 });
  else m = new THREE.MeshStandardMaterial({ color, roughness: o.rough ?? (D === "B" ? 0.7 : 0.85), metalness: o.metal || 0, emissive: o.glow ? color : "#000000", emissiveIntensity: o.glow ? 1.6 : 0, vertexColors: !!o.vc, transparent: !!o.opacity, opacity: o.opacity || 1, flatShading: !!o.flat, envMapIntensity: o.env ?? 0.6 });
  bendify(m);
  matCache.set(k, m);
  return m;
}
// Contour encré (B fin, C épais) : coque retournée poussée le long des normales.
const OUT = { A: 0, B: 0.018, C: 0.045 }[D];
const outlineMat = OUT ? bendify(new THREE.MeshBasicMaterial({ color: D === "C" ? "#2b2140" : "#3a4566", side: THREE.BackSide }), OUT) : null;
const world = new THREE.Group(); scene.add(world);
function add(geo, material, x, y, z, parent, o = {}) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  if (o.ry) m.rotation.y = o.ry;
  if (o.rx) m.rotation.x = o.rx;
  if (o.rz) m.rotation.z = o.rz;
  if (o.s) m.scale.set(...o.s);
  m.castShadow = o.cast !== false; m.receiveShadow = true;
  (parent || world).add(m);
  if (outlineMat && o.outline !== false) { const ol = new THREE.Mesh(geo, outlineMat); m.add(ol); }
  return m;
}
const RB = { A: 0.06, B: 0.035, C: 0.16 }[D];
const box = (w, h, d, r) => { const rr = Math.min(r ?? RB, w / 2.05, h / 2.05, d / 2.05); return new RoundedBoxGeometry(w, h, d, D === "C" ? 5 : 3, rr).translate(0, h / 2, 0); };
const cyl = (rt, rb, h, seg = 24) => new THREE.CylinderGeometry(rt, rb, h, seg).translate(0, h / 2, 0);
const cone = (r, h, seg = 24) => new THREE.ConeGeometry(r, h, seg).translate(0, h / 2, 0);
const ball = (r, d = 3) => new THREE.IcosahedronGeometry(r, d);
function prism(w, h, d) { // toit à deux pans
  const s = new THREE.Shape(); s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(0, h); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: true, bevelSize: 0.02, bevelThickness: 0.02, bevelSegments: 2 });
  g.translate(0, 0, -d / 2); g.computeVertexNormals(); return g;
}
function halfCyl(r, len) { return new THREE.CylinderGeometry(r, r, len, 24, 1, false, 0, Math.PI).rotateZ(Math.PI / 2).rotateY(Math.PI / 2); }

// ---------- Sol : tuiles hexagonales biseautées ----------
function hexShape(r) { const s = new THREE.Shape(); for (let i = 0; i < 6; i++) { const a = (Math.PI / 3) * i + Math.PI / 6; const x = Math.cos(a) * r, y = Math.sin(a) * r; i ? s.lineTo(x, y) : s.moveTo(x, y); } s.closePath(); return s; }
const BASE = { A: -2.2, B: -0.9, C: -1.4 }[D];
function tileGeo(top, grass, soil, seed, road) {
  const bevel = { A: 0.09, B: 0.035, C: 0.16 }[D];
  const r = { A: 0.975, B: 1.0, C: 0.96 }[D];
  const depth = top - BASE;
  const g = new THREE.ExtrudeGeometry(hexShape(r - bevel), { depth, bevelEnabled: true, bevelSize: bevel, bevelThickness: bevel * 0.8, bevelSegments: D === "B" ? 1 : 3, curveSegments: 1 });
  g.rotateX(-Math.PI / 2);
  g.translate(0, BASE + bevel * 0.8, 0);
  g.computeVertexNormals();
  const p = g.attributes.position, n = g.attributes.normal, col = new Float32Array(p.count * 3);
  const cg = new THREE.Color(), strata = D === "A" ? ["#7b4e33", "#9a6844", "#b88a5c", "#6a4230", "#8e6a4d"] : D === "B" ? ["#e8dccb", "#d9cbb6"] : ["#8a5a3b", "#6e4630"];
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i);
    if (n.getY(i) > 0.55 && y > top - 0.06) {
      // Dessus : herbe (ou pavés) avec un léger dégradé radial.
      const d = Math.hypot(p.getX(i), p.getZ(i));
      cg.set(grass).lerp(new THREE.Color(road ? "#ffffff" : D === "A" ? "#fff6c9" : "#ffffff"), (1 - d) * (D === "A" ? 0.08 : 0.04));
    } else if (y > top - (D === "A" ? 0.16 : 0.1)) cg.set(grass).multiplyScalar(0.82); // liseré d'herbe sur le biseau
    else {
      const band = Math.floor((top - y) / (D === "A" ? 0.34 : 0.5) + seed * 3) % strata.length;
      cg.set(strata[band]);
      if (D !== "B") cg.multiplyScalar(0.72 + 0.28 * Math.max(0, (y - BASE) / (top - BASE))); // occlusion en bas de falaise
    }
    col[i * 3] = cg.r; col[i * 3 + 1] = cg.g; col[i * 3 + 2] = cg.b;
  }
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  return g;
}
const GRASS = { A: ["#8fbf4d", "#9ccb57", "#86b645"], B: ["#9fd08a", "#aad796", "#94c97f"], C: ["#7fd35a", "#8ddd63", "#74c950"] }[D];
const ROADC = { A: "#d9c39a", B: "#ead7c0", C: "#f4d58d" }[D];
const tileTop = new Map();
tiles.forEach((t, k) => {
  const w = hw(t.q, t.r);
  let top = t.h + (t.hub ? 0.12 : 0);
  if (t.kind === "wild") top = t.h;
  const tint = t.terr && D === "B" ? mix(GRASS[0], t.terr.color, 0.14) : null;
  let grass = t.road ? ROADC : t.kind === "wild" ? (D === "A" ? "#e6d3a0" : D === "B" ? "#f0dcb8" : "#ffe7a3") : tint ? hex(tint) : GRASS[Math.floor(rnd("g" + k) * 3)];
  if (t.hub) grass = hex(mix(grass, t.terr.color, D === "C" ? 0.35 : 0.22));
  add(tileGeo(top, grass, null, rnd("s" + k), t.road), mat("#ffffff", { vc: true, rough: 0.95 }), w.x, 0, w.z, null, { outline: D === "C" });
  tileTop.set(k, top);

  cx.strokeStyle = "rgba(255,255,255,.8)"; cx.lineWidth = 3; for (let k = 0; k < 3; k++) { cx.beginPath(); for (let a = 0; a < 7; a += 0.1) { const r = 6 + a * 7.5; const px = 64 + Math.cos(a + k * 2.09) * r, py = 64 + Math.sin(a + k * 2.09) * r; a ? cx.lineTo(px, py) : cx.moveTo(px, py); } cx.stroke(); }

const portals = [];

  g.fillStyle = color; g.beginPath(); g.arc(48, 48, 42, 0, 7); g.fill(); g.lineWidth = 6; g.strokeStyle = D === "C" ? "#2b2140" : "#fff"; g.stroke();

const blob = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, "rgba(0,0,0,.5)"); gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); const t = new THREE.CanvasTexture(c); return t; })();

// ---------- Peuplement ----------
const labels = [];
TERR.forEach((t) => {
  const w = hw(t.c[0], t.c[1]), y = topOf(t.c[0], t.c[1]);
  if (t.id !== "phare") {

  } else labels.push({ kind: "p", t, pos: new THREE.Vector3(w.x, y + 3.1, w.z) });
});
tiles.forEach((tile, k) => {
  const w = hw(tile.q, tile.r), y = topOf(tile.q, tile.r);
  const task = taskAt.get(k);
  if (task) {
    const t = task.terr, ry = (rnd("ry" + k) - 0.5) * 0.6;

    else if (task.type === "fire") { const g = house(w.x, y, w.z, t, { ry, seed: k, built: 0.5 }); scaffold(g, 0.78, 0.7, 0.66); fire(w.x, y, w.z, 0.5); smoke(new THREE.Vector3(w.x, y + 1.2, w.z), true); }
    else if (task.type === "late") { house(w.x, y, w.z, t, { ry, seed: k, built: 0.35 }); clock(w.x, y + 1.7, w.z); }
    else if (task.type === "fog") { stakes(w.x, y, w.z); fogPuffs(w.x, y, w.z); }
    else if (task.type === "todo") stakes(w.x, y, w.z);

    if (task.type === "done" && rnd("av" + k) < 0.5) avatar(w.x - 0.55, y + 1.25, w.z + 0.2, "QM", "#4F6AF5");

  if (tile.hub || tile.road) return;

keeper(hw(1, 0).x + 0.2, topOf(1, 0), hw(1, 0).z + 0.3);
// Pont de bois vers le jardin.
{
  const a = hw(-2, 3), b = hw(-2, 4), y = 0.32;
