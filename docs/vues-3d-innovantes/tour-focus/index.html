<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"

<style>
  :root {
    --focus: #14b8a6;
    --focus-clair: #5eead4;
    --or: #f5c66b;
    --texte: #eaf4f5;
    --texte-doux: rgba(214, 232, 238, .66);
    --verre: rgba(14, 30, 46, .42);
    --bord: rgba(170, 225, 235, .16);
    --police: Inter, "Segoe UI", Roboto, "Helvetica Neue", "Liberation Sans", Arial, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: #040a16; overflow: hidden; }
  body { font-family: var(--police); color: var(--texte); -webkit-font-smoothing: antialiased; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 70% at 50% 48%, transparent 55%, rgba(2, 6, 14, .55) 100%); }
  .verre {
    background: var(--verre);
    border: 1px solid var(--bord);
    backdrop-filter: blur(18px) saturate(1.25);
    -webkit-backdrop-filter: blur(18px) saturate(1.25);
    box-shadow: 0 10px 40px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .06);
  }
  .hud { position: fixed; pointer-events: none; }
  .marque { top: 26px; left: 30px; display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 12px; border-radius: 14px; }
  .marque svg { display: block; }
  .marque b { font-weight: 650; letter-spacing: .01em; font-size: 15px; }
  .marque span { color: var(--texte-doux); font-size: 14px; }
  .marque i { width: 1px; height: 16px; background: var(--bord); }

  .focus { top: 24px; left: 50%; transform: translateX(-50%); padding: 14px 22px 16px; border-radius: 18px; min-width: 330px; }
  .focus .ligne { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; }
  .focus .titre { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .focus .titre em { font-style: normal; color: var(--focus-clair); }
  .focus .compte { font-size: 15px; color: var(--texte-doux); font-variant-numeric: tabular-nums; }
  .focus .compte strong { color: var(--texte); font-weight: 650; }
  .barre { position: relative; height: 5px; margin-top: 11px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; }
  .barre::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 42.86%; border-radius: 99px;
    background: linear-gradient(90deg, #0f8f82, var(--focus) 55%, var(--or)); box-shadow: 0 0 12px rgba(20, 184, 166, .7); }

  .profil { top: 26px; right: 30px; display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 16px; border-radius: 14px; }
  .profil .nom { text-align: right; line-height: 1.25; }
  .profil .nom b { display: block; font-size: 15px; font-weight: 600; }
  .profil .nom span { font-size: 12.5px; color: var(--texte-doux); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 650; font-size: 14px;
    color: #042a26; background: linear-gradient(145deg, var(--focus-clair), var(--focus)); box-shadow: 0 0 0 2px rgba(94, 234, 212, .25); }

  .semaine { bottom: 26px; left: 30px; display: flex; align-items: center; gap: 16px; padding: 10px 18px; border-radius: 16px; font-size: 13px; }
  .semaine .lbl { color: var(--texte-doux); }
  .jours { display: flex; gap: 12px; }
  .jour { display: flex; align-items: center; gap: 6px; color: rgba(214, 232, 238, .45); }
  .jour::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1px solid rgba(214, 232, 238, .35); }
  .jour.fait { color: var(--texte); }
  .jour.fait::before { background: var(--focus); border-color: var(--focus); box-shadow: 0 0 8px var(--focus); }
  .jour.auj { color: var(--focus-clair); font-weight: 600; }
  .jour.auj::before { border-color: var(--focus-clair); background: conic-gradient(var(--focus-clair) 0 43%, transparent 43%); box-shadow: 0 0 8px rgba(94, 234, 212, .6); }
  .aide { bottom: 30px; right: 32px; font-size: 12px; color: rgba(214, 232, 238, .38); }
  .still .aide { display: none; }

  @media (max-width: 760px) {
    .marque { top: 14px; left: 16px; } .marque span, .marque i { display: none; }
    .profil { top: 14px; right: 16px; } .profil .nom { display: none; }
    .focus { top: 76px; min-width: 0; width: calc(100% - 32px); box-sizing: border-box; }
    .semaine { bottom: 16px; left: 16px; width: calc(100% - 32px); box-sizing: border-box; justify-content: center; }
    .semaine .lbl, .aide { display: none; }
  }
</style>

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const params = new URLSearchParams(location.search);
const STILL = params.get("still") === "1";
const CAM = params.get("cam") || "ensemble";
if (STILL) document.body.classList.add("still");

const POLICE = 'Inter, "Segoe UI", Roboto, "Helvetica Neue", "Liberation Sans", Arial, sans-serif';

/* ------------------------------------------------------------------ données fictives */
const PROJETS = {
  lot2b: { nom: "Lot 2B", couleur: "#8b5cf6" },
  quai: { nom: "Passerelle quai Nord", couleur: "#e07b1a" },
  jardin: { nom: "Jardin", couleur: "#22a06b" },
  com: { nom: "Communication", couleur: "#2e86ab" },
};
// 7 tâches du jour, dont 4 en focus ; 3 terminées (une s'évapore, une finit de s'envoler, une est déjà partie).
const TACHES = [
  { titre: "Réserves Lot 2B", projet: "lot2b", focus: true, echeance: "aujourd'hui · 14:00", detail: "12 réserves · 5 levées",
    pos: { ang: -56, y: 3.05, r: 3.45 }, inc: 10 },
  { titre: "Préparer la réunion de chantier", projet: "quai", focus: true, echeance: "aujourd'hui · 16:30", detail: "Ordre du jour · 6 points",
    pos: { ang: 50, y: 4.3, r: 3.45 }, inc: -10 },
  { titre: "Relancer le client pour la validation", projet: "com", focus: true, echeance: "aujourd'hui · 17:00", detail: "Plans indice C",
    pos: { ang: -30, y: 7.85, r: 3.5 }, inc: 8 },
  { titre: "Plan de plantation du massif Est", projet: "jardin", focus: false, echeance: "aujourd'hui · 18:00", detail: "14 essences",
    pos: { ang: 64, y: 9.0, r: 4.2 }, inc: -8 },
  { titre: "Revue DOE", projet: "lot2b", focus: true, fait: true, echeance: "terminée à 11:42", detail: "",
    pos: { ang: 14, y: 11.35, r: 2.15 }, inc: 4, dissolution: 0.42 },
  { titre: "Commande des garde-corps", projet: "quai", focus: false, fait: true, echeance: "terminée à 09:15", detail: "",
    pos: { ang: 26, y: 14.5, r: 1.9 }, inc: -6, dissolution: 0.64, echelle: 0.72 },
  // « Photos d'avancement pour la newsletter » (Communication) : terminée, déjà évaporée.
];

/* ------------------------------------------------------------------ moteur */
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(STILL ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const FOG = new THREE.Color("#0f2c3e");
scene.fog = new THREE.FogExp2(FOG, 0.0108);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 1200);
const VUES = {
  ensemble: { pos: [0.6, 9.4, 27.5], cible: [0, 6.5, 0], fov: 42, focale: 27.2 },
  proche: { pos: [2.1, 11.0, 13.2], cible: [0.6, 9.45, 0], fov: 40, focale: 12.6 },
};
const vue = VUES[CAM] || VUES.ensemble;
camera.position.set(...vue.pos);
camera.fov = vue.fov;
camera.updateProjectionMatrix();
const cible = new THREE.Vector3(...vue.cible);
camera.lookAt(cible);

/* ------------------------------------------------------------------ utilitaires */
function texCanvas(c, { repeat = false, srgb = true } = {}) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = ANISO;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function alea(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const rnd = alea(20260924);
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function halo(taille = 256, stops = [[0, "rgba(255,255,255,1)"], [0.35, "rgba(255,255,255,.35)"], [1, "rgba(255,255,255,0)"]]) {
  const c = document.createElement("canvas"); c.width = c.height = taille;
  const g = c.getContext("2d"); const gr = g.createRadialGradient(taille / 2, taille / 2, 0, taille / 2, taille / 2, taille / 2);
  for (const [o, col] of stops) gr.addColorStop(o, col);
  g.fillStyle = gr; g.fillRect(0, 0, taille, taille);
  return texCanvas(c);
}
const TEX_HALO = halo();

const NOISE_GLSL = /* glsl */`
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
  float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
    return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y); }
  float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ v += a * vnoise(p); p *= 2.03; a *= 0.5; } return v; }
`;

/* ------------------------------------------------------------------ ciel */
{
  const geo = new THREE.SphereGeometry(600, 48, 24);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { haut: { value: new THREE.Color("#030814") }, milieu: { value: new THREE.Color("#0a1a33") },
      horizon: { value: new THREE.Color("#1d5566") }, bas: { value: new THREE.Color("#07141f") } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 haut, milieu, horizon, bas; varying vec3 vDir; ${NOISE_GLSL}
      void main(){ float h = vDir.y;
        vec3 c = mix(horizon, milieu, smoothstep(0.0, 0.3, h));
        c = mix(c, haut, smoothstep(0.2, 0.75, h));
        c = mix(c, bas, smoothstep(0.0, -0.12, h));
        // étoiles très discrètes
        vec2 sp = vec2(atan(vDir.z, vDir.x) * 180.0, h * 260.0);
        float st = step(0.9965, hash(floor(sp))) * smoothstep(0.12, 0.5, h);
        c += vec3(0.55, 0.7, 0.85) * st * 0.35;
        // voile lumineux autour de l'axe de la tour
        float az = atan(vDir.x, vDir.z);
        c += vec3(0.05, 0.2, 0.2) * exp(-az*az*6.0) * smoothstep(0.35, 0.0, abs(h - 0.05)) * 0.35;
        gl_FragColor = vec4(c, 1.0); }`,
  });
  const sky = new THREE.Mesh(geo, mat); sky.userData.sansProfondeur = true; scene.add(sky);
}

/* ------------------------------------------------------------------ sol + reflet */
{
  const sol = new THREE.Mesh(new THREE.CircleGeometry(420, 96),
    new THREE.MeshStandardMaterial({ color: "#081725", roughness: 0.55, metalness: 0.35 }));
  sol.rotation.x = -Math.PI / 2; scene.add(sol);
  const reflet = new THREE.Mesh(new THREE.PlaneGeometry(34, 34), new THREE.MeshBasicMaterial({
    map: halo(256, [[0, "rgba(94,234,212,.3)"], [0.25, "rgba(20,184,166,.1)"], [1, "rgba(20,184,166,0)"]]),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
  reflet.rotation.x = -Math.PI / 2; reflet.position.y = 0.02; reflet.userData.sansProfondeur = true; scene.add(reflet);
}

/* ------------------------------------------------------------------ arrière-plan : le reste de Nexora dans la brume */
{
  const matSil = new THREE.MeshStandardMaterial({ color: "#0d2032", roughness: 1, metalness: 0 });
  const matFen = new THREE.PointsMaterial({ map: TEX_HALO, size: 0.9, color: "#9fd8e0", transparent: true, opacity: 0.55, depthWrite: false, fog: true });
  const fenetres = [];
  const bat = (grp, x, z, w, d, h, sol = 0, o = new THREE.Vector3()) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matSil); m.position.set(x, sol + h / 2, z); grp.add(m);
    const n = Math.floor(h / 3);
    for (let i = 0; i < n; i++) if (rnd() < 0.3) fenetres.push(new THREE.Vector3(x + (rnd() - 0.5) * w * 0.8, sol + 1.5 + i * 3, z + d / 2 + 0.05).add(o));
  };
  // îles flottantes coiffées de silhouettes
  const iles = [
    { a: -38, d: 72, y: 13, r: 9 }, { a: -64, d: 95, y: 24, r: 12 }, { a: 34, d: 78, y: 17, r: 10 },
    { a: 62, d: 104, y: 9, r: 13 }, { a: -12, d: 130, y: 31, r: 11 }, { a: 14, d: 118, y: 7, r: 9 },
    { a: -88, d: 88, y: 6, r: 10 }, { a: 90, d: 80, y: 21, r: 8 }, { a: 140, d: 90, y: 14, r: 11 }, { a: -140, d: 96, y: 18, r: 10 },
  ];
  for (const il of iles) {
    const g = new THREE.Group(); const a = THREE.MathUtils.degToRad(il.a);
    g.position.set(Math.sin(a) * il.d, il.y, -Math.cos(a) * il.d);
    const hR = il.r * (0.9 + rnd() * 0.5), prof = [[0.02, -hR], [0.22, -hR * 0.78], [0.5, -hR * 0.5], [0.78, -hR * 0.22], [1, -0.2], [0.98, 0.35], [0.02, 0.35]]
      .map(([a, b]) => new THREE.Vector2(a * il.r * (0.9 + rnd() * 0.15), b));
    const roc = new THREE.Mesh(new THREE.LatheGeometry(prof, 9), matSil); roc.rotation.y = rnd() * 3; g.add(roc);
    const nb = 2 + Math.floor(rnd() * 4);
    for (let i = 0; i < nb; i++) {
      const ang = rnd() * Math.PI * 2, rad = rnd() * il.r * 0.55;
      bat(g, Math.cos(ang) * rad, Math.sin(ang) * rad, 1.5 + rnd() * 3, 1.5 + rnd() * 3, 2.5 + rnd() * il.r * 0.9, 0.4, g.position);
    }
    if (rnd() < 0.5) { const f = new THREE.Mesh(new THREE.ConeGeometry(0.9, 6, 4), matSil); f.position.set(il.r * 0.3, 3.4, 0); g.add(f); }
    scene.add(g);
  }
  // ligne d'horizon urbaine
  const ville = new THREE.Group();
  for (let i = 0; i < 90; i++) {
    const a = (i / 90) * Math.PI * 2 + rnd() * 0.05; const d = 150 + rnd() * 50;
    if (Math.abs(Math.sin(a * 0.5)) < 0.08) continue;
    bat(ville, Math.sin(a) * d, -Math.cos(a) * d, 4 + rnd() * 9, 4 + rnd() * 9, 6 + Math.pow(rnd(), 2) * 38);
  }
  scene.add(ville);
  const gf = new THREE.BufferGeometry().setFromPoints(fenetres);
  { const fp = new THREE.Points(gf, matFen); fp.userData.sansProfondeur = true; scene.add(fp); }

  // nappes de brume (texture de bruit sur canvas)
  const c = document.createElement("canvas"); c.width = c.height = 512; const g = c.getContext("2d");
  for (let i = 0; i < 260; i++) {
    const x = rnd() * 512, y = 170 + (rnd() - 0.5) * 220, r = 30 + rnd() * 90;
    const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, "rgba(255,255,255,.07)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const fade = g.createLinearGradient(0, 0, 0, 512); fade.addColorStop(0, "rgba(0,0,0,1)"); fade.addColorStop(0.35, "rgba(0,0,0,0)");
  fade.addColorStop(0.65, "rgba(0,0,0,0)"); fade.addColorStop(1, "rgba(0,0,0,1)");
  g.globalCompositeOperation = "destination-out"; g.fillStyle = fade; g.fillRect(0, 0, 512, 512);
  const texBrume = texCanvas(c);
  const brumes = new THREE.Group(); brumes.name = "brumes";
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2 + rnd(); const d = 22 + rnd() * 50;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(60 + rnd() * 50, 14 + rnd() * 10), new THREE.MeshBasicMaterial({
      map: texBrume, color: new THREE.Color("#5f8fae"), transparent: true, opacity: 0.1 + rnd() * 0.1, depthWrite: false, fog: false }));
    m.position.set(Math.sin(a) * d, 1.5 + rnd() * 6, -Math.cos(a) * d);
    m.lookAt(0, m.position.y, 0);
    m.userData.sansProfondeur = true; m.userData.vitesse = (rnd() - 0.5) * 0.01;
    brumes.add(m);
  }
  scene.add(brumes);
}

/* ------------------------------------------------------------------ lumières */
scene.add(new THREE.HemisphereLight("#4b6f96", "#07121c", 0.45));
const lune = new THREE.DirectionalLight("#a8c0ff", 0.55); lune.position.set(-18, 26, -14); scene.add(lune);
const face = new THREE.DirectionalLight("#7fa6c8", 0.25); face.position.set(8, 10, 24); scene.add(face);
const lumTour = new THREE.PointLight("#5eead4", 34, 40, 1.8); lumTour.position.set(0, 4.5, 0); scene.add(lumTour);
const lumPied = new THREE.PointLight("#2dd4bf", 12, 16, 2); lumPied.position.set(0, 1.9, 1.8); scene.add(lumPied);

/* ------------------------------------------------------------------ socle : cinq gradins gravés, un par jour */
const JOURS = ["LUN.", "MAR.", "MER.", "JEU.", "VEN."];
const ETAT_JOUR = [1, 1, 1, 3 / 7, 0]; // lun.-mer. passés, jeu. en cours (3/7), ven. à venir
const H_GRADIN = 0.3, R_GRADINS = [7.4, 6.55, 5.7, 4.85, 4.0];
const Y_SOCLE = H_GRADIN * 5;

function tuileFlanc() {
  const c = document.createElement("canvas"); c.width = 1024; c.height = 128; const g = c.getContext("2d");
  g.fillStyle = "#d9d3c5"; g.fillRect(0, 0, 1024, 128);
  for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(${rnd() < 0.5 ? "70,62,50" : "255,255,255"},${rnd() * 0.08})`; g.fillRect(rnd() * 1024, rnd() * 128, 2, 2); }
  const gr = g.createLinearGradient(0, 0, 0, 128); gr.addColorStop(0, "rgba(255,255,255,.18)"); gr.addColorStop(0.12, "rgba(255,255,255,0)");
  gr.addColorStop(0.85, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,.18)"); g.fillStyle = gr; g.fillRect(0, 0, 1024, 128);
  // graduations
  g.strokeStyle = "rgba(92,84,70,.55)"; g.lineCap = "round";
  for (let i = 0; i <= 64; i++) { const x = i * 16; g.lineWidth = i % 8 === 0 ? 3 : 1.6; g.beginPath(); g.moveTo(x, 10); g.lineTo(x, i % 8 === 0 ? 34 : 22); g.stroke(); }
  // runes procédurales
  g.lineWidth = 3.2; g.strokeStyle = "rgba(88,80,66,.6)";
  for (let i = 0; i < 8; i++) {
    const x = 64 + i * 128, y0 = 52, y1 = 104; g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1);
    const n = 1 + Math.floor(rnd() * 3);

  }
  // halo derrière la carte
  const gl = new THREE.Mesh(new THREE.PlaneGeometry(CW * 1.55, CH * 1.9), new THREE.MeshBasicMaterial({ map: TEX_HALO,
    color: t.fait ? "#f5b54a" : t.focus ? "#14b8a6" : p.couleur, transparent: true, opacity: t.fait ? 0.22 : 0.12, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  gl.position.z = -0.12; gl.userData.sansProfondeur = true; inner.add(gl);
  // attache lumineuse vers l'axe de la tour
  if (!t.fait) {
    const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
    const lien = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: t.focus ? "#5eead4" : p.couleur, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false }));
    lien.userData.sansProfondeur = true; scene.add(lien); grp.userData.lien = lien;
  }
  const s = t.echelle || 1; grp.scale.setScalar(s);
  scene.add(grp); cartes.push(grp);
});

/* ------------------------------------------------------------------ particules */
function spriteRond() { return halo(64, [[0, "rgba(255,255,255,1)"], [0.3, "rgba(255,255,255,.55)"], [1, "rgba(255,255,255,0)"]]); }
const TEX_POINT = spriteRond();
const uPR = { value: renderer.getPixelRatio() * innerHeight / 1000 };
// poussière sarcelle qui monte en spirale
{
  const N = 1400, pos = new Float32Array(N * 3), gr = new Float32Array(N * 4);
  for (let i = 0; i < N; i++) {
    const r = Math.pow(rnd(), 1.6) * 7.5 + 0.3;
    gr.set([r, rnd() * Math.PI * 2, rnd() * 24, 0.4 + rnd()], i * 4);
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pos, 3)); geo.setAttribute("aG", new THREE.BufferAttribute(gr, 4));
  const mat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTemps, map: { value: TEX_POINT }, uPR, uCouleur: { value: new THREE.Color("#5eead4") } },
    vertexShader: `attribute vec4 aG; uniform float uTemps, uPR; varying float vA;
      void main(){ float r = aG.x; float ang = aG.y + uTemps * 0.12 * aG.w / (0.6 + r * 0.25);
        float y = ${Y_SOCLE.toFixed(2)} + mod(aG.z + uTemps * 0.22 * aG.w, 24.0);
        vec3 p = vec3(cos(ang) * r, y, sin(ang) * r);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vA = smoothstep(0.0, 2.0, y - ${Y_SOCLE.toFixed(2)}) * (1.0 - smoothstep(14.0, 24.0, y)) * (0.35 + 0.65 * exp(-r * 0.35));
        gl_PointSize = (1.4 + aG.w * 1.6) * uPR * (22.0 / -mv.z); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform sampler2D map; uniform vec3 uCouleur; varying float vA;
      void main(){ float a = texture2D(map, gl_PointCoord).a; gl_FragColor = vec4(uCouleur * 1.6 * a * vA, 1.0); }`,
  });
  const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; pts.userData.sansProfondeur = true; scene.add(pts);
}
// particules dorées qui s'échappent des tâches terminées
cartes.filter((c) => c.userData.t.fait).forEach((c, k) => {
  const t = c.userData.t;
  const N = t.dissolution > 0.6 ? 380 : 900, gr = new Float32Array(N * 4);
  for (let i = 0; i < N; i++) {
    // origine : dans la partie déjà dissoute (haut de la carte)
    const u = rnd(), v = 1 - rnd() * Math.min(1, t.dissolution * 1.25);
    gr.set([(u - 0.5) * CW, (v - 0.5) * CH, rnd(), rnd()], i * 4);
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(N * 3), 3)); geo.setAttribute("aG", new THREE.BufferAttribute(gr, 4));
  const mat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTemps, map: { value: TEX_POINT }, uPR },
    vertexShader: `attribute vec4 aG; uniform float uTemps, uPR; varying float vA; varying float vT;
      void main(){ float t = fract(aG.z + uTemps * (0.08 + aG.w * 0.07));
        float h = t * (2.6 + aG.w * 3.2);
        vec3 p = vec3(aG.x + sin(t * 5.0 + aG.w * 20.0) * 0.35 * t + (aG.w - 0.5) * t * 1.6, aG.y + h, sin(t * 4.0 + aG.z * 30.0) * 0.5 * t);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vT = t; vA = smoothstep(0.0, 0.06, t) * (1.0 - smoothstep(0.35, 1.0, t));
        gl_PointSize = (1.0 + 2.6 * (1.0 - t) * (0.4 + aG.w)) * uPR * (16.0 / -mv.z); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform sampler2D map; varying float vA; varying float vT;
      void main(){ float a = texture2D(map, gl_PointCoord).a; vec3 c = mix(vec3(1.0, 0.86, 0.5), vec3(1.0, 0.62, 0.22), vT);
        gl_FragColor = vec4(c * 2.4 * a * vA, 1.0); }`,
  });
  const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; pts.userData.sansProfondeur = true;
  c.userData.inner.add(pts);
});

/* ------------------------------------------------------------------ post-traitement */
class BokehDoux extends BokehPass {
  render(renderer, writeBuffer, readBuffer, dt, mask) {
    // passe de profondeur maison : les halos et effets additifs sont ignorés, les cartes qui s'évaporent
    // n'écrivent que leur partie intacte.
    const caches = [], echanges = [], matDepth = this.materialDepth;
    scene.traverse((o) => {
      if (o.userData.sansProfondeur && o.visible) { o.visible = false; caches.push(o); return; }
      if (o.isMesh || o.isLine || o.isPoints) { echanges.push([o, o.material]); o.material = o.userData.matProfondeur || matDepth; }
    });
    this.materialDepth = null;
    const orig = renderer.render.bind(renderer); let premier = true;
    renderer.render = (sc, cam) => { orig(sc, cam); if (premier) { premier = false; echanges.forEach(([o, m]) => (o.material = m)); caches.forEach((o) => (o.visible = true)); } };
    super.render(renderer, writeBuffer, readBuffer, dt, mask);
    renderer.render = orig; this.materialDepth = matDepth;
  }
}
const composer = new EffectComposer(renderer);
composer.setPixelRatio(renderer.getPixelRatio());
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehDoux(scene, camera, { focus: vue.focale, aperture: CAM === "proche" ? 0.00032 : 0.00024, maxblur: 0.01 });
if (params.get("dof") !== "0") composer.addPass(bokeh);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.45, 0.95);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ------------------------------------------------------------------ interaction */
let controls = null;
if (!STILL) {
  controls = new OrbitControls(camera, canvas);
  controls.target.copy(cible); controls.enableDamping = true; controls.dampingFactor = 0.06;
  controls.minDistance = 7; controls.maxDistance = 45; controls.maxPolarAngle = Math.PI * 0.53; controls.enablePan = false;
  controls.update();
}
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight);
  uPR.value = renderer.getPixelRatio() * innerHeight / 1000;
});

/* ------------------------------------------------------------------ animation */
const tmp = new THREE.Vector3();
function miseAJour(temps) {
  uTemps.value = temps;
  const rot = STILL ? 0 : temps * 0.045;
  for (const c of cartes) {
    const u = c.userData, t = u.t;
    const a = u.ang + rot * (t.fait ? 0.6 : 1);
    const monte = t.fait && !STILL ? ((temps * 0.08 + u.phase) % 1) * 0.0 : 0;
    const y = u.y + Math.sin(temps * 0.6 + u.phase) * 0.12 + monte;
    c.position.set(Math.sin(a) * u.r, y, Math.cos(a) * u.r);
    c.lookAt(camera.position.x, y + (camera.position.y - y) * 0.35, camera.position.z);
    u.inner.rotation.y = THREE.MathUtils.degToRad(t.inc);
    u.inner.rotation.z = Math.sin(temps * 0.4 + u.phase) * 0.012;
    if (u.lien) {
      const p = u.lien.geometry.attributes.position;
      tmp.set(0, -CH * 0.35, -0.05).applyMatrix4(c.matrixWorld);
      p.setXYZ(0, tmp.x, tmp.y, tmp.z); p.setXYZ(1, 0, y - 0.9, 0); p.needsUpdate = true;
    }
  }
  const brumes = scene.getObjectByName("brumes");
  brumes.rotation.y = temps * 0.004;
}

let images = 0; const t0 = performance.now();
function boucle() {
  const temps = STILL ? 12.0 : 12.0 + (performance.now() - t0) / 1000;
  camera.updateMatrixWorld();
  miseAJour(temps);
  scene.updateMatrixWorld();
  miseAJour(temps); // seconde passe : les liens utilisent les matrices à jour
  if (controls) controls.update();
  composer.render();
  images++;
  if (images === 3) window.__ready = true;
  if (!STILL || images < 3) requestAnimationFrame(boucle);
}
boucle();
</script>
