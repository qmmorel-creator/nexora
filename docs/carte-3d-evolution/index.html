<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte 3D : évolution par lots</title>
<!--
  Avant / après de la vue Carte (Nexora), toujours sur la même carte :
    ?s=0  Maintenant (rendu actuel de l'application)
    ?s=1  Lot 1 : lumière, matières, palette et signaux harmonisés
    ?s=2  Lot 2 : terrain, eau et ciel
    ?s=3  Lot 3 : « game feel » (panneaux de bois, sélection, vie)
    ?s=4  Lot 4 : vrais modèles 3D issus de bibliothèques gratuites (Kenney, CC0)
  Chaque lot s'ajoute aux précédents. Ajouter &still=1 pour une image fixe.
  Rien ici n'est branché sur Nexora : c'est une maquette autonome.
-->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
} }
</script>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#bfe3f2; font-family:Inter, -apple-system, "Segoe UI", sans-serif; color:#18263d; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  #stage canvas { display:block; width:100%; height:100%; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  .tabs { position:fixed; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:6px; pointer-events:auto; z-index:5; }
  .tabs a { text-decoration:none; font-weight:700; font-size:13px; color:#18263d; background:rgba(255,255,255,.9); border:1px solid rgba(24,38,61,.15); border-radius:999px; padding:7px 14px; white-space:nowrap; }
  .tabs a.on { background:#18263d; color:#fff; }
  .caption { position:fixed; right:16px; bottom:16px; max-width:380px; font-size:12.5px; line-height:1.45; background:rgba(255,255,255,.92); border-radius:12px; padding:10px 12px; box-shadow:0 4px 16px rgba(24,38,61,.15); }
  .caption b { display:block; font-size:14px; margin-bottom:2px; }
  .ribbon { position:absolute; top:14px; left:16px; display:flex; gap:10px; }
  .badge { width:62px; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .badge i { position:relative; width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-weight:800; }
  .badge small { font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:5px; white-space:nowrap; }
  .res { position:absolute; top:94px; left:16px; display:flex; gap:2px; padding:3px; }
  .res span { display:flex; gap:5px; align-items:baseline; padding:4px 9px; font-size:11.5px; font-weight:600; }
  .res b { font-size:15px; font-weight:800; }
  .lbl { position:absolute; transform:translate(-50%,-100%); white-space:nowrap; }
  .lbl-p { display:flex; align-items:center; gap:6px; padding:5px 11px 5px 8px; font-size:12.5px; font-weight:700; }
  .lbl-p .dot { width:10px; height:10px; border-radius:3px; }
  .lbl-p em { font-style:normal; font-weight:600; font-size:11.5px; opacity:.75; border-left:1px solid currentColor; padding-left:6px; }
  .lbl-p em b { color:#c62828; }
  .lbl-t { display:flex; align-items:center; gap:6px; padding:3px 9px; font-size:11.5px; font-weight:600; }
  .lbl-t .st { width:8px; height:8px; border-radius:50%; }

  /* Interface actuelle de l'application (maintenant, lots 1 et 2). */
  .N .badge i { background:conic-gradient(currentColor calc(var(--p)*1%), #e6ebf1 0); }
  .N .badge i::before { content:""; position:absolute; inset:5px; border-radius:50%; background:#fff; }
  .N .badge i::after { content:attr(data-n); position:absolute; color:#18263d; }
  .N .badge small, .N .res, .N .lbl-p { background:#fff; color:#18263d; box-shadow:0 2px 8px rgba(24,38,61,.18); }
  .N .res { border-radius:10px; }
  .N .lbl-p { border-radius:8px; }
  .N .lbl-t { background:rgba(24,38,61,.85); color:#fff; border-radius:6px; }
  .N .lbl-t b { color:#ffd23f; }
  .N.soft .badge small, .N.soft .res, .N.soft .lbl-p { background:rgba(255,252,244,.95); box-shadow:0 3px 12px rgba(60,40,10,.16); }
  .N.soft .lbl-t { background:rgba(59,42,20,.82); color:#fff7e6; border-radius:8px; }
  .N.soft .res span:first-child { color:#c9574b !important; }

  /* Lot 3 : interface de jeu — cadres de bois, parchemin, plaques. */
  .G { font-family:"Trebuchet MS", Inter, sans-serif; }
  .G .badge i { background:radial-gradient(circle at 35% 30%, #fff7df, #f1dfb5 70%); border:4px solid #7a4b2a; box-shadow:0 0 0 2px #d9b77a, 0 4px 0 #4e2f19, 0 6px 12px rgba(40,25,10,.35); }
  .G .badge i::before { content:""; position:absolute; inset:-4px; border-radius:50%; background:conic-gradient(#e0a93a calc(var(--p)*1%), transparent 0); -webkit-mask:radial-gradient(circle, transparent 58%, #000 60%); mask:radial-gradient(circle, transparent 58%, #000 60%); }
  .G .badge i::after { content:attr(data-n); position:absolute; color:#4e2f19; font-size:17px; }
  .G .badge small { background:#7a4b2a; color:#fff3d6; border:1px solid #4e2f19; box-shadow:0 2px 0 #4e2f19; }
  .G .res { background:linear-gradient(#8a5a33, #6d4424); border:2px solid #4e2f19; border-radius:12px; padding:5px; gap:4px; box-shadow:0 4px 0 #3e2412, 0 8px 18px rgba(40,25,10,.35); }
  .G .res span { background:linear-gradient(#fff6de, #f0dfb6); border-radius:7px; color:#4e2f19 !important; box-shadow:inset 0 -2px 0 rgba(120,80,30,.25); }
  .G .res span i { width:9px; height:9px; border-radius:50%; align-self:center; }
  .G .lbl-t { background:linear-gradient(#fff6de, #efdcb0); color:#4e2f19; border:2px solid #7a4b2a; border-radius:8px; box-shadow:0 3px 0 #4e2f19; font-weight:700; }
  .G .lbl-t b { color:#b5561d; }
  .card { position:absolute; width:236px; transform:translate(-50%, -100%); background:linear-gradient(#fff8e4, #f2e1b8); border:3px solid #7a4b2a; border-radius:14px; box-shadow:0 5px 0 #4e2f19, 0 12px 24px rgba(40,25,10,.35); padding:10px 12px 11px; color:#4e2f19; font-size:12px; }
  .card h4 { margin:0 0 3px; font-size:15px; }
  .card .bar { height:9px; border-radius:6px; background:#dcc594; box-shadow:inset 0 1px 2px rgba(0,0,0,.25); margin:7px 0 6px; overflow:hidden; }
  .card .bar i { display:block; height:100%; width:60%; background:linear-gradient(#f4c24f, #d9912c); }
  .card .row { display:flex; gap:6px; margin-top:8px; }
  .card .row span { flex:1; text-align:center; background:#7a4b2a; color:#fff3d6; border-radius:8px; padding:4px 0; font-weight:700; font-size:11px; box-shadow:0 2px 0 #4e2f19; }
  .card.side { transform:translate(22px, -50%); }
  .card.side::after { left:-11px; top:50%; bottom:auto; transform:translateY(-50%) rotate(135deg); }
  .card::after { content:""; position:absolute; left:50%; bottom:-11px; width:16px; height:16px; background:#f2e1b8; border-right:3px solid #7a4b2a; border-bottom:3px solid #7a4b2a; transform:translateX(-50%) rotate(45deg); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui"></div>
<nav class="tabs" id="tabs"></nav>
<div class="caption" id="caption"></div>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const params = new URLSearchParams(location.search);
const S = Math.max(0, Math.min(4, parseInt(params.get("s") ?? "4", 10) || 0));
const STILL = params.has("still");
const INFO = [
  ["Maintenant", "Le rendu actuel : matières mates à facettes, ciel uni, horloges et avatars très saturés, interface blanche."],
  ["Lot 1 · Lumière et matières", "Matières douces qui reflètent le ciel, feuillages lisses, ombres de contact, lueurs (bloom) sur lanternes et fenêtres, étalonnage chaud, horloges émaillées plus petites, avatars pastel bordés de blanc."],
  ["Lot 2 · Terrain, eau et ciel", "Coutures entre tuiles adoucies, plages et galets, herbe dense, eau avec profondeur, écume irrégulière et reflets, ciel en dégradé, ombres de nuages, brume lointaine et îles à l'horizon."],
  ["Lot 3 · Game feel", "Interface en bois et parchemin, panneaux de bois plantés dans le décor pour les projets, sélection dorée avec fiche, papillons, oiseaux, lucioles."],
  ["Lot 4 · Vrais modèles 3D", "Modèles gratuits Kenney (licence CC0) recolorés dans la palette : maisons, sapins, personnages, bannières, trophée, pièces, drapeau, buissons."],
];
document.body.classList.add(S >= 3 ? "G" : "N");
if (S >= 1 && S < 3) document.body.classList.add("soft");
document.getElementById("tabs").innerHTML = INFO.map((x, i) => `<a href="?s=${i}" class="${i === S ? "on" : ""}">${i ? "Lot " + i : "Maintenant"}</a>`).join("");
document.getElementById("caption").innerHTML = `<b>${INFO[S][0]}</b>${INFO[S][1]}`;
if (STILL) { document.getElementById("tabs").style.display = "none"; document.getElementById("caption").style.display = "none"; }

// ---------- Modèles gratuits (lot 4) ----------
const GL = {};
if (S >= 4) {
  const loader = new GLTFLoader();
  const names = ["ville/building-small-a", "ville/building-small-b", "ville/building-small-c", "ville/building-small-d", "arene/tree", "arene/banner", "arene/trophy", "arene/character-soldier", "arene/bricks", "plateforme/character", "plateforme/coin", "plateforme/flag", "plateforme/grass", "plateforme/grass-small"];
  const regraded = new Map();
  // Recoloration douce des planches de couleurs Kenney vers la palette « diorama » (plus chaude, moins saturée).
  function regrade(tex, warm) {
    if (regraded.has(tex)) return regraded.get(tex);
    const img = tex.image, c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
    const g = c.getContext("2d"); g.filter = warm ? "none" : "saturate(0.95) sepia(0.1)"; g.drawImage(img, 0, 0);
    if (warm) { // bleus, verts et violets de la planche « ville » ramenés vers terre cuite, ocre et crème
      const d = g.getImageData(0, 0, c.width, c.height), a = d.data, col = new THREE.Color(), hsl = {};
      for (let i = 0; i < a.length; i += 4) {
        col.setRGB(a[i] / 255, a[i + 1] / 255, a[i + 2] / 255); col.getHSL(hsl);
        if (hsl.s > 0.2 && hsl.h > 0.2 && hsl.h < 0.95) { const k = (hsl.h * 7) % 1; col.setHSL(0.03 + k * 0.08, Math.min(0.62, hsl.s * 0.8), Math.min(0.72, hsl.l * 1.05 + 0.04)); }
        else if (hsl.s <= 0.2) col.setHSL(0.08, 0.12, hsl.l);
        a[i] = col.r * 255; a[i + 1] = col.g * 255; a[i + 2] = col.b * 255;
      }
      g.putImageData(d, 0, 0);
    }
    const t = new THREE.CanvasTexture(c); t.flipY = tex.flipY; t.colorSpace = THREE.SRGBColorSpace; t.wrapS = tex.wrapS; t.wrapT = tex.wrapT; t.magFilter = tex.magFilter; t.minFilter = tex.minFilter;
    regraded.set(tex, t); return t;
  }
  await Promise.all(names.map((n) => loader.loadAsync(`modeles/${n}.glb`).then((g) => {
    g.scene.traverse((o) => { if (o.isMesh) { o.material = o.material.clone(); if (o.material.map) o.material.map = regrade(o.material.map, n.startsWith("ville/")); o.material.envMapIntensity = 0.55; if (n === "arene/tree") o.material.color.set("#a6d27c"); o.material.roughness = Math.max(0.6, o.material.roughness); o.castShadow = o.receiveShadow = true; } });
    GL[n.split("/")[1]] = g.scene;
  }).catch((e) => console.error("modèle", n, e.message))));
}

// ---------- Outils ----------
const SQ3 = Math.sqrt(3);
const hw = (q, r) => ({ x: SQ3 * (q + r / 2), z: 1.5 * r });
const hdist = (a, b) => (Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[0] + a[1] - b[0] - b[1])) / 2;
const key = (q, r) => q + "," + r;
const NB = [[1, 0], [-1, 0], [0, 1], [0, -1], [1, -1], [-1, 1]];
function rnd(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; }
const mix = (a, b, t) => new THREE.Color(a).lerp(new THREE.Color(b), t);
const hex = (c) => "#" + new THREE.Color(c).getHexString();

// ---------- Données : la même carte à chaque étape ----------
const TERR = [
  { id: "lot", name: "Lot 2B", color: "#8b5cf6", c: [0, 0], R: 2, pct: 14, late: 6 },
  { id: "pass", name: "Passerelle quai Nord", color: "#e07b1a", c: [4, 1], R: 2, pct: 25, late: 2 },
  { id: "jardin", name: "Jardin", color: "#22a06b", c: [-4, 6], R: 2, pct: 60, late: 1 },
  { id: "phare", name: "Communication", color: "#2e86ab", c: [6, -4], R: 1, pct: 0, late: 0 },
];
// [territoire, dq, dr, type, avancement, titre]
const TASKS = [
  ["lot", 1, -1, "done", 100, "Point budget hebdo"],
  ["lot", -1, 0, "build", 60, "Revue DOE"],
  ["lot", 1, -2, "fire", 30, "Réserves Lot 2B"],
  ["lot", -2, 1, "late", 0, "Réunion de chantier 2"],
  ["lot", 2, -1, "fog", 0, "Demande lame piste"],
  ["lot", -1, -1, "done", 100, "Récolement DREAL"],
  ["pass", -1, 1, "done", 100, "Plan de levage"],
  ["pass", 1, -1, "milestone", 70, "Mise en service"],
  ["pass", 2, -1, "wait", 40, "Validation client"],
  ["pass", -2, 1, "todo", 0, "Commande garde-corps"],
  ["pass", 1, 1, "build", 30, "Tablier"],
  ["jardin", 1, -1, "done", 100, "Plantations"],
  ["jardin", -1, 1, "build", 40, "Allées"],
  ["jardin", 1, 0, "todo", 0, "Arrosage auto"],
  ["phare", 0, 0, "lighthouse", 100, "Séminaire PCH"],
];
const SELECTED = "Validation client";
const ROAD_DIRS = [[1, 0], [0, 1]];
const tiles = new Map();
TERR.forEach((t) => {
  for (let dq = -t.R; dq <= t.R; dq++) for (let dr = -t.R; dr <= t.R; dr++) {
    if (hdist([0, 0], [dq, dr]) > t.R) continue;
    const q = t.c[0] + dq, r = t.c[1] + dr;
    const road = t.R > 1 && ROAD_DIRS.some(([a, b]) => (dq === a && dr === b) || (dq === 2 * a && dr === 2 * b));
    tiles.set(key(q, r), { q, r, terr: t, hub: dq === 0 && dr === 0, road, kind: "land", h: 0.42 + rnd("h" + q + r) * 0.14 });
  }
  for (let dq = -t.R - 1; dq <= t.R + 1; dq++) for (let dr = -t.R - 1; dr <= t.R + 1; dr++) {
    if (hdist([0, 0], [dq, dr]) !== t.R + 1) continue;
    const q = t.c[0] + dq, r = t.c[1] + dr;
    if (tiles.has(key(q, r)) || rnd("w" + q + r) < 0.72) continue;
    tiles.set(key(q, r), { q, r, terr: null, kind: "wild", h: 0.3 + rnd("h" + q + r) * 0.1 });
  }
});
const taskAt = new Map();
TASKS.forEach(([tid, dq, dr, type, pct, title]) => {
  const t = TERR.find((x) => x.id === tid);
  taskAt.set(key(t.c[0] + dq, t.c[1] + dr), { type, pct, title, terr: t });
});
const shore = (t) => NB.some(([a, b]) => !tiles.has(key(t.q + a, t.r + b)));

// ---------- Rendu ----------
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = S === 0 ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = S === 0 ? 1.12 : 0.98;
renderer.localClippingEnabled = true;
document.getElementById("stage").appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, W / H, 0.5, 400);

function skyTexture(top, mid, bottom, glow) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 256;
  const g = c.getContext("2d"); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, top); gr.addColorStop(0.55, mid); gr.addColorStop(1, bottom);
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  if (glow) { const rg = g.createRadialGradient(215, 40, 0, 215, 40, 150); rg.addColorStop(0, "rgba(255,244,214,.85)"); rg.addColorStop(1, "rgba(255,244,214,0)"); g.fillStyle = rg; g.fillRect(0, 0, 256, 256); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const SKY = ["#86bfe6", "#cfe6ef", "#f6e3c0"];
if (S >= 2) scene.background = skyTexture(...SKY, true);
else scene.background = new THREE.Color("#bfe3f2");
if (S >= 1) {
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.MeshBasicMaterial({ map: skyTexture(...SKY), side: THREE.BackSide })));
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(envScene, 0.04).texture;
}
scene.fog = S >= 2 ? new THREE.Fog("#e7e3d2", 40, 112) : new THREE.Fog("#bfe3f2", 60, 170);

const hemi = S === 0 ? new THREE.HemisphereLight("#ffffff", "#9a8a5e", 1.35) : new THREE.HemisphereLight("#9cc9ea", "#6f6045", 0.72);
scene.add(hemi);
const sun = S === 0 ? new THREE.DirectionalLight("#fff6e0", 2.1) : new THREE.DirectionalLight("#ffd9a3", 3.0);
sun.position.set(...(S === 0 ? [18, 34, 18] : [26, 22, 10]));
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 140 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);
const center = new THREE.Vector3();
{ let n = 0; tiles.forEach((t) => { const w = hw(t.q, t.r); center.x += w.x; center.z += w.z; n++; }); center.divideScalar(n); }
sun.target.position.copy(center); scene.add(sun.target);
sun.position.add(center);
const sunDir = sun.position.clone().sub(center).normalize();

// ---------- Matériaux ----------
const matCache = new Map();
function mat(color, o = {}) {
  const k = hex(color) + JSON.stringify(o);
  if (matCache.has(k)) return matCache.get(k);
  let m;
  const base = { color, vertexColors: !!o.vc, transparent: !!o.opacity, opacity: o.opacity || 1 };
  if (S === 0) m = new THREE.MeshLambertMaterial({ ...base, flatShading: !o.smooth, emissive: o.glow ? color : "#000000", emissiveIntensity: o.glow ? 0.8 : 0 });
  else m = new THREE.MeshStandardMaterial({ ...base, roughness: o.rough ?? 0.85, metalness: o.metal || 0, emissive: o.glow ? color : "#000000", emissiveIntensity: o.glow ? (o.gi ?? 1.6) : 0, flatShading: !!o.flat, envMapIntensity: o.env ?? 0.6 });
  if (o.opacity) m.depthWrite = o.opacity > 0.9;
  matCache.set(k, m);
  return m;
}
const world = new THREE.Group(); scene.add(world);
function add(geo, material, x, y, z, parent, o = {}) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  if (o.ry) m.rotation.y = o.ry;
  if (o.rx) m.rotation.x = o.rx;
  if (o.rz) m.rotation.z = o.rz;
  if (o.s) m.scale.set(...o.s);
  m.castShadow = o.cast !== false; m.receiveShadow = true;
  (parent || world).add(m);
  return m;
}
const RB = S === 0 ? 0.015 : 0.06;
const box = (w, h, d, r) => { const rr = Math.min(r ?? RB, w / 2.05, h / 2.05, d / 2.05); return new RoundedBoxGeometry(w, h, d, S === 0 ? 1 : 3, rr).translate(0, h / 2, 0); };
const cyl = (rt, rb, h, seg = 24) => new THREE.CylinderGeometry(rt, rb, h, S === 0 ? Math.min(seg, 8) : seg).translate(0, h / 2, 0);
const cone = (r, h, seg = 24) => new THREE.ConeGeometry(r, h, S === 0 ? Math.min(seg, 7) : seg).translate(0, h / 2, 0);
const ball = (r, d = 3) => new THREE.IcosahedronGeometry(r, S === 0 ? Math.min(d, 1) : d);
function prism(w, h, d) {
  const s = new THREE.Shape(); s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(0, h); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: S > 0, bevelSize: 0.02, bevelThickness: 0.02, bevelSegments: 2 });
  g.translate(0, 0, -d / 2); g.computeVertexNormals(); return g;
}
// Feuillage lisse avec dégradé vertical (lot 1) : plus sombre dessous, lumineux dessus.
function leafGeo(r, color) {

// ---------- Lot 3 : vie et sélection ----------
const flutter = [], glowRing = [];
if (S >= 3) {
  const wing = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"); g.fillStyle = "#fff"; g.beginPath(); g.ellipse(30, 26, 26, 20, -0.4, 0, 7); g.fill(); g.beginPath(); g.ellipse(26, 48, 16, 12, 0.3, 0, 7); g.fill(); return new THREE.CanvasTexture(c); })();
  const cols = ["#ffd23f", "#ff9ec4", "#ffffff", "#9fd3ff", "#ffb35c"];
  const spots = [...tiles.values()].filter((t) => !t.road && !t.hub && !taskAt.has(key(t.q, t.r)));
  for (let i = 0; i < 16; i++) {
    const t = spots[Math.floor(rnd("bf" + i) * spots.length)], w = hw(t.q, t.r);
    const g = new THREE.Group(); g.position.set(w.x + (rnd("bx" + i) - 0.5), topOf(t.q, t.r) + 0.45 + rnd("bh" + i) * 0.6, w.z + (rnd("bz" + i) - 0.5)); g.rotation.y = rnd("bry" + i) * 6; world.add(g);
    const m = new THREE.MeshBasicMaterial({ map: wing, color: cols[i % cols.length], transparent: true, side: THREE.DoubleSide, alphaTest: 0.4 });
    [-1, 1].forEach((s) => { const p = add(new THREE.PlaneGeometry(0.16, 0.16).translate(0.08, 0, 0).rotateX(-Math.PI / 2), m, 0, 0, 0, g, { cast: false }); p.scale.x = s; p.rotation.z = s * 0.7; flutter.push({ p, s, ph: i }); });
  }
  // Oiseaux en V au loin.
  for (let i = 0; i < 7; i++) {
    const g = new THREE.Group(); g.position.set(center.x - 12 + i * 2.2 + rnd("ox" + i) * 2, 8.5 + rnd("oy" + i) * 2.5, center.z - 14 + rnd("oz" + i) * 5); g.rotation.y = 0.62; world.add(g);
    [-1, 1].forEach((s) => add(box(0.42, 0.03, 0.08, 0.01), mat("#3b3440"), s * 0.19, 0, 0, g, { rz: s * 0.35, cast: false }));
  }
  // Lucioles dans les sous-bois du jardin et des rivages sauvages.
  spots.filter((t) => t.kind === "wild" || t.terr?.id === "jardin").forEach((t, j) => {
    const w = hw(t.q, t.r);
    for (let i = 0; i < 3; i++) add(new THREE.SphereGeometry(0.035, 8, 6), mat("#fff3a0", { glow: true, gi: 3 }), w.x + (rnd("ff" + j + i) - 0.5) * 1.3, topOf(t.q, t.r) + 0.25 + rnd("fh" + j + i) * 0.5, w.z + (rnd("fz" + j + i) - 0.5) * 1.3, null, { cast: false });
  });
  // Sélection : anneau doré lumineux, halo au sol et étincelles.
  if (selPos) {
    const ring = add(new THREE.TorusGeometry(0.9, 0.06, 12, 64).rotateX(Math.PI / 2), mat("#ffcf5a", { glow: true, gi: 2.4 }), selPos.x, selPos.y + 0.05, selPos.z, null, { cast: false });
    glowRing.push(ring);
    const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d");
    const gr = g.createRadialGradient(64, 64, 20, 64, 64, 64); gr.addColorStop(0, "rgba(255,214,110,.55)"); gr.addColorStop(0.7, "rgba(255,200,90,.25)"); gr.addColorStop(1, "rgba(255,200,90,0)"); g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    add(new THREE.PlaneGeometry(2.4, 2.4).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }), selPos.x, selPos.y + 0.03, selPos.z, null, { cast: false });
    for (let i = 0; i < 10; i++) { const a = i / 10 * 6.28; add(new THREE.OctahedronGeometry(0.035), mat("#fff1b0", { glow: true, gi: 3 }), selPos.x + Math.cos(a) * 0.95, selPos.y + 0.3 + rnd("sp" + i) * 1.1, selPos.z + Math.sin(a) * 0.95, null, { cast: false }); }
  }
}

// ---------- Caméra ----------
const yaw = 0.62, pitch = 0.66, dist = 33;
const target = center.clone().add(new THREE.Vector3(0.6, 0.6, 0.2));
camera.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
camera.lookAt(target);
camera.updateMatrixWorld(true);

// ---------- Post-traitement ----------
const composer = new EffectComposer(renderer);
composer.setPixelRatio(renderer.getPixelRatio());
composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
if (S >= 1) composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.38, 0.5, 0.93));
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(W, H) }, uSat: { value: S === 0 ? 1.0 : 1.14 }, uWarm: { value: S === 0 ? 0 : 0.045 }, uTilt: { value: 1 }, uVig: { value: S === 0 ? 0 : 0.36 } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uSat; uniform float uWarm; uniform float uTilt; uniform float uVig; varying vec2 vUv;
    void main(){
      float d = max(0.0, abs(vUv.y - 0.52) - 0.16); float r = clamp(d / 0.34, 0.0, 1.0); r = r * r * 5.0 * uTilt;
      vec4 c = vec4(0.0); float tw = 0.0;
      for (int i = -3; i <= 3; i++) for (int j = -3; j <= 3; j++) { float w = exp(-float(i*i + j*j) / 6.0); c += texture2D(tDiffuse, vUv + vec2(float(i), float(j)) * r / uRes) * w; tw += w; }
      c /= tw;
      float l = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));
      vec3 col = mix(vec3(l), c.rgb, uSat);
      col += vec3(uWarm, uWarm * 0.4, -uWarm * 0.6);
      vec2 q = vUv - 0.5; col *= 1.0 - uVig * dot(q, q) * 2.2;
      gl_FragColor = vec4(col, 1.0);
    }`,
});
composer.addPass(grade);
composer.addPass(new OutputPass());

// ---------- Interface par-dessus ----------
const ui = document.getElementById("ui");
const RES = [[9, "Retards", "#d6332a"], [1, "Aujourd'hui", "#e07b1a"], [4, "En cours", "#245edb"], [1, "Bloquées", "#6b4ce6"], [1, "À compléter", "#64748b"]];
ui.innerHTML = `
  <div class="ribbon">${[["Chantiers", 16, "#e07b1a", 2], ["Jardin", 60, "#22a06b", 1], ["Com.", 0, "#2e86ab", 1]].map(([n, p, c, k]) => `<div class="badge"><i data-n="${k}" style="--p:${p};color:${c}"></i><small>${n}</small></div>`).join("")}</div>
  <div class="res">${RES.map(([n, l, c]) => `<span style="color:${c}">${S >= 3 ? `<i style="background:${c}"></i>` : ""}<b>${n}</b> ${l}</span>`).join("")}</div>`;
const v = new THREE.Vector3();
function placeLabels() {
  ui.querySelectorAll(".lbl, .card").forEach((e) => e.remove());
  labels.forEach((l) => {
    v.copy(l.pos).project(camera);
    const x = (v.x + 1) / 2 * W, y = (1 - v.y) / 2 * H;
    const e = document.createElement("div"); e.className = "lbl";
    if (l.kind === "p") e.innerHTML = `<div class="lbl-p"><span class="dot" style="background:${l.t.color}"></span>${l.t.name}<em>${l.t.pct} %${l.t.late ? ` · <b>${l.t.late} en retard</b>` : ""}</em></div>`;
    else e.innerHTML = `<div class="lbl-t"><span class="st" style="background:${l.task.type === "late" || l.task.type === "fire" ? (S === 0 ? "#e5332a" : "#d9654f") : "#0ea5e9"}"></span>${l.task.title}${l.task.pct && l.task.pct < 100 ? ` <b>${l.task.pct} %</b>` : ""}</div>`;
    e.style.left = x + "px"; e.style.top = y - 6 + "px";
    ui.appendChild(e);
  });
  if (selPos) {
    v.copy(selPos).add(new THREE.Vector3(0.5, 0.7, 0)).project(camera);
    const e = document.createElement("div"); e.className = "card side";
    e.innerHTML = `<h4>Validation client</h4>Passerelle quai Nord · échéance ven. 3 oct.<div class="bar"><i style="width:40%"></i></div>40 % · en attente du client<div class="row"><span>Terminer</span><span>Reporter</span><span>Ouvrir</span></div>`;
    e.style.left = (v.x + 1) / 2 * W + "px"; e.style.top = (1 - v.y) / 2 * H + "px";
    ui.appendChild(e);
  }
}
placeLabels();

// ---------- Animation ----------
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let t0 = performance.now(), frames = 0;
function frame(now) {
  const t = reduce || STILL ? 2.3 : (now - t0) / 1000;
  sway.forEach((g) => { g.rotation.z = Math.sin(t * 1.3 + g.userData.sway) * 0.03; g.rotation.x = Math.cos(t * 1.1 + g.userData.sway) * 0.02; });
  flames.forEach((f) => { const k = 0.85 + 0.25 * Math.sin(t * 9 + f.ph * 3); f.m.scale.set(1, k, 1); });
  smokes.forEach((s) => { const u = (t * (s.dark ? 0.35 : 0.22) + s.ph) % 1; s.m.position.set(s.base.x + u * 0.5, s.base.y + u * (s.dark ? 2.2 : 1.4), s.base.z + u * 0.15); s.m.scale.setScalar(0.6 + u * (s.dark ? 2.4 : 1.8)); });
  cranes.forEach((c, i) => { c.rotation.y = 0.6 + Math.sin(t * 0.4 + i) * 0.5; });
  clocks.forEach((c) => { c.rotation.y = Math.atan2(camera.position.x - c.position.x, camera.position.z - c.position.z); c.rotation.z = Math.sin(t * 6) * (S === 0 ? 0.08 : 0.04); });
  fogs.forEach((f) => { const a = f.a + t * 0.2; f.m.position.x = f.x + Math.cos(a) * 0.55; f.m.position.z = f.z + Math.sin(a) * 0.55; });
  gems.forEach((g) => { g.rotation.y = t; });
  coins.forEach((c) => { c.rotation.y = 0.62 + t * 1.5; });
  portals.forEach((p) => { p.rotation = -t * 0.9; });
  flags.forEach((f) => { f.rotation.y = Math.sin(t * 2) * 0.3; });
  flutter.forEach((f) => { f.p.rotation.z = f.s * (0.2 + Math.abs(Math.sin(t * 14 + f.ph)) * 0.9); });
  glowRing.forEach((r) => { const k = 1 + Math.sin(t * 3) * 0.04; r.scale.set(k, 1, k); });
  clouds.forEach((c, i) => { c.position.x += reduce || STILL ? 0 : 0.004 * (1 + i % 2); });
  composer.render();
  if (++frames === 3) window.__ready = true;
  if (!STILL || frames < 3) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener("resize", () => location.reload());
</script>
</body>
</html>
