<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Prototypes Nexora</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Onest:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Coque de démonstration : bandeau sombre neutre au-dessus d'une scène claire,
   pour que l'œil sépare l'outil de comparaison de la maquette elle-même. */
:root {
  --sh-bg: #e9ecf1; --sh-bar: #141a24; --sh-bar-2: #222b38; --sh-ink: #f3f5f8; --sh-dim: #9aa6b6;
  --sh-on: #ffd35a; --sh-frame: #0e131b;
  --sh-font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--sh-bg); color: #18202c; font-family: var(--sh-font); }
* { box-sizing: border-box; }
.demo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--sh-bar); color: var(--sh-ink); padding: 8px 16px 10px; display: grid; gap: 8px; }
.demo-row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.demo-badge { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; background: var(--sh-on); color: #141a24; padding: 3px 8px; border-radius: 4px; font-weight: 700; }
.demo-note { color: var(--sh-dim); font-size: 13px; }
.demo-note a { color: var(--sh-ink); }
.demo-group { display: flex; flex-wrap: wrap; gap: 4px; }
.demo-label { color: var(--sh-dim); font-size: 12px; min-width: 64px; }
.demo button { font: inherit; font-size: 13px; color: var(--sh-ink); background: var(--sh-bar-2); border: 1px solid transparent; border-radius: 6px; padding: 5px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.demo button:hover { border-color: #3a4657; }
.demo button[aria-pressed="true"] { background: var(--sh-ink); color: #141a24; font-weight: 700; }
.demo button .n { font-size: 11px; opacity: .7; }
.demo button:focus-visible, .app :focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
.idee { color: var(--sh-ink); font-size: 13px; line-height: 1.4; max-width: 110ch; }
.idee b { color: var(--sh-on); }
.stage { padding: 16px; display: flex; justify-content: center; }
.stage.is-desktop .app { width: 100%; max-width: 1480px; height: max(680px, calc(100vh - 190px)); border-radius: 10px; box-shadow: 0 1px 2px rgba(15,20,30,.08), 0 12px 40px rgba(15,20,30,.12); }
.stage.is-mobile .app { width: 390px; max-width: 100%; height: 800px; max-height: calc(100vh - 170px); min-height: 560px; border-radius: 34px; border: 10px solid var(--sh-frame); box-shadow: 0 20px 50px rgba(15,20,30,.25); }
.app { container: app / inline-size; overflow: hidden; position: relative; background: #fff; color: #18202c; }
@media (max-width: 720px) { .stage { padding: 0; } .stage.is-mobile .app, .stage.is-desktop .app { border: 0; border-radius: 0; width: 100%; height: calc(100vh - 150px); max-height: none; } .demo-label { display: none; } }

/* Petits composants partagés par tous les concepts (chaque concept les restyle). */
.k-dot { display: inline-block; width: .6em; height: .6em; border-radius: 50%; background: var(--c); margin-right: .45em; vertical-align: .05em; flex: none; }
.k-st { display: inline-flex; align-items: center; gap: .4em; }
.k-st::before { content: ""; width: .55em; height: .55em; border-radius: 50%; background: var(--c); }
.k-av { display: inline-grid; place-items: center; width: 1.7em; height: 1.7em; border-radius: 50%; background: #e7ebf1; color: #2b3647; font-size: .72em; font-weight: 700; margin-right: .45em; vertical-align: middle; flex: none; }
.k-crit { color: var(--c); font-weight: 600; }
.k-rel { color: #66758b; font-size: .9em; margin-left: .3em; }
.k-rel.is-late { color: #c42727; font-weight: 600; }
.k-muted { color: #8090a5; }
.k-tok { display: inline-flex; gap: .35em; align-items: baseline; padding: .2em .55em; border-radius: 999px; background: #eef2f7; font-size: .82em; color: #2b3647; }
.k-tok b { font-weight: 600; color: #66758b; font-size: .9em; }
.k-tok-title { background: #fff; border: 1px solid #dfe5ee; }
.k-toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: #18202c; color: #fff; padding: 9px 14px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.2); z-index: 40; animation: k-in .25s ease-out; }
@keyframes k-in { from { opacity: 0; transform: translate(-50%, 8px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<style id="concept-css"></style>
</head>
<body>

<header class="demo" aria-label="Commandes de la démonstration">
  <div class="demo-row">
    <span class="demo-badge">Démo</span>
    <span class="demo-note">Données fictives, date fixée au lundi 5 octobre 2026, 10 h 40. Rien n'est enregistré. <a href="index.html">Retour à l'analyse</a></span>
    <button type="button" data-reset>Réinitialiser</button>
  </div>
  <div class="demo-row"><span class="demo-label">Concept</span><div class="demo-group" id="concept-tabs"></div></div>
  <div class="demo-row"><span class="demo-label">Situation</span><div class="demo-group" id="screen-tabs"></div>
    <span class="demo-label">Appareil</span><div class="demo-group"><button type="button" data-device="desktop">Ordinateur</button><button type="button" data-device="mobile">Mobile</button></div></div>
  <p class="idee" id="idee"></p>
</header>
<main class="stage" id="stage"><div class="app" id="app"></div></main>

<script src="kit.js"></script>
<script src="c-cadran.js"></script>
<script src="c-classeur.js"></script>
<script src="c-partition.js"></script>
<script src="c-mosaique.js"></script>
<script src="c-carnet.js"></script>
<script src="c-sommaire.js"></script>
<script src="shell.js"></script>
</body>
</html>
