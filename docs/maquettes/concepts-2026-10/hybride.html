<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nexora hybride</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Prototype hybride, priorité ordinateur. Identité Nexora (DESIGN.md) :
   Inter, bleu d'action, surfaces blanches bordées sur fond gris-bleu,
   rayons 7 / 10 px. Densité « outil de travail » : texte 13,5 px, lignes de
   30 px, chiffres tabulaires, aucune ombre au repos. Thème clair assumé. */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --soft: #f7f9fc; --line: #e2e8f0; --line-2: #cfd8e3;
  --ink: #18263d; --ink-2: #53647b; --ink-3: #8090a5; --blue: #245edb; --blue-soft: #eaf0ff;
  --red: #c42727; --red-soft: #fdecec; --amber: #9a5b05; --amber-soft: #fdf3df; --green: #16a34a;
  --r-card: 10px; --r-ctl: 7px;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--ink-2); background: #fff; }
.demo { background: #141a24; color: #c9d2de; font-size: 12.5px; padding: 6px 16px; display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; }
.demo b { background: #ffd35a; color: #141a24; border-radius: 3px; padding: 1px 6px; font-size: 11px; letter-spacing: .06em; }
.demo a { color: #fff; } .demo button { color: #fff; border: 1px solid #3a4657; border-radius: 5px; padding: 2px 8px; }
#hx-app { height: calc(100% - 32px); display: flex; flex-direction: column; min-height: 640px; position: relative; }
.k-dot { display: inline-block; width: .6em; height: .6em; border-radius: 50%; background: var(--c); margin-right: .45em; }
.k-st { display: inline-flex; align-items: center; gap: .4em; } .k-st::before { content: ""; width: .55em; height: .55em; border-radius: 50%; background: var(--c); }
.k-av { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: #e7ebf1; color: #2b3647; font-size: 10px; font-weight: 700; margin-right: 6px; }
.k-crit { color: var(--c); font-weight: 600; } .k-rel { color: var(--ink-3); margin-left: 6px; } .k-rel.is-late { color: var(--red); font-weight: 600; } .k-muted { color: var(--ink-3); }
.k-tok { display: inline-flex; gap: 4px; padding: 2px 8px; border-radius: 99px; background: #eef2f7; font-size: 12px; } .k-tok b { color: var(--ink-3); font-weight: 500; } .k-tok-title { background: #fff; border: 1px solid var(--line); }

/* Barre haute */
.hx-top { display: flex; align-items: center; gap: 18px; padding: 0 18px; height: 50px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
.hx-logo { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .01em; }
.hx-logo i { width: 18px; height: 18px; border-radius: 5px; background: conic-gradient(from 200deg, #00b4ff, #7b3cff, #ff2fa0, #ffa31a, #00b4ff); }
.hx-nav { display: flex; gap: 2px; height: 100%; }
.hx-nav button { padding: 0 12px; height: 100%; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 6px; }
.hx-nav button:hover { color: var(--ink); }
.hx-nav button[aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--blue); }
.hx-nav em { font-style: normal; font-size: 10.5px; font-weight: 700; background: var(--red-soft); color: var(--red); border-radius: 99px; padding: 0 6px; }
.hx-search { margin-left: auto; color: var(--ink-3); border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 5px 10px; min-width: 240px; display: flex; justify-content: space-between; gap: 10px; background: var(--soft); }
.hx-btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-ctl); padding: 6px 12px; font-weight: 600; white-space: nowrap; }
.hx-btn:hover { border-color: #b7c3d2; }
.hx-btn.is-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.hx-btn.is-primary:hover { background: #194bb6; }
.hx-btn.is-ghost { border-color: transparent; color: var(--ink-2); }
.hx-btn.is-sm { padding: 2px 8px; font-size: 12.5px; font-weight: 500; }

/* Corps de page */
.hx-body { flex: 1; min-height: 0; display: flex; position: relative; }
.hx-main { flex: 1; min-width: 0; overflow: auto; padding: 18px 22px 40px; }
.hx-hello { margin-bottom: 14px; }
.hx-hello h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.hx-hello h1 span { font-weight: 500; color: var(--ink-2); font-size: 15px; margin-left: 6px; }
.hx-hello p { margin: 3px 0 0; color: var(--ink-2); max-width: 110ch; }
.hx-hello.hx-row { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.hx-hello.hx-row > div:first-child { flex: 1; min-width: 260px; }
.hx-dim { color: var(--ink-3); } .hx-red { color: var(--red); }
.hx-hint { color: var(--ink-3); font-size: 12.5px; margin: 10px 0 0; }
.hx-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px 14px; min-width: 0; }
.hx-th { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
.hx-th h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); margin: 0; font-weight: 600; }
.hx-th h2 small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink-3); margin-left: 4px; }
.hx-th.is-sub { margin-top: 14px; }
.hx-more { margin-left: auto; color: var(--blue); font-weight: 600; font-size: 12.5px; }
.hx-badge { font-family: var(--mono); font-size: 12px; background: var(--soft); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }

/* Listes de tâches */
.hx-list { list-style: none; margin: 0; padding: 0; }
.hx-tr { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto 64px; gap: 8px; align-items: center; min-height: 30px; border-bottom: 1px solid #eef1f5; padding: 0 2px; }
.hx-tr:last-child { border-bottom: 0; }
.hx-tr:hover, .hx-tr.is-sel { background: var(--soft); }
.hx-ck { width: 15px; height: 15px; border: 1.5px solid #9aa6b6; border-radius: 4px; display: grid; place-items: center; font-size: 10px; color: #fff; text-align: center; }
.hx-ck.is-on, .is-done .hx-ck { background: var(--green); border-color: var(--green); }
.hx-tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.is-done .hx-tt { text-decoration: line-through; color: var(--ink-3); }
.hx-pj { color: var(--ink-3); font-size: 12px; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
.hx-pj i, .hx-plist i, .hx-ptable i, .hx-wl i, .hx-crumb i, .hx-pick i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.hx-due { font-family: var(--mono); font-size: 12px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.hx-due.is-late { color: var(--red); font-weight: 500; }

/* Accueil : mosaïque condensée sur 12 colonnes */
.hx-hello p b { color: var(--ink); font-weight: 600; }
.hx-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
.hx-t-day { grid-column: span 7; } .hx-t-late { grid-column: span 5; }
.hx-t-proj { grid-column: span 7; } .hx-t-body { grid-column: span 5; }
.hx-t-week { grid-column: span 7; } .hx-t-money { grid-column: span 5; }
.hx-dayin { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 14px; align-items: center; }
.hx-mini .hx-dial { width: 200px; height: auto; display: block; }
.hx-ptable { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.hx-ptable th, .hx-ptable td { padding: 6px 6px; border-bottom: 1px solid #eef1f5; text-align: left; white-space: nowrap; }
.hx-ptable thead th { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }
.hx-ptable tbody th button { display: flex; align-items: center; gap: 7px; font-weight: 600; }
.hx-ptable td:nth-child(2) { width: 30%; } .hx-ptable td small { color: var(--ink-3); margin-left: 6px; }
.hx-ptable td button { color: var(--ink); } .hx-ptable td button:hover, .hx-ptable th button:hover { color: var(--blue); }
.hx-bar { display: inline-block; vertical-align: middle; width: calc(100% - 44px); height: 5px; background: #edf0f4; border-radius: 99px; overflow: hidden; }
.hx-bar i { display: block; height: 100%; border-radius: 99px; }
.hx-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.hx-kpis.is-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.hx-kpis > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hx-kpis small { color: var(--ink-3); font-size: 11.5px; }
.hx-kpis b { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; } .hx-kpis b span { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.hx-kpis .hx-bar { width: 100%; margin-top: 4px; }
.hx-kpis.is-inline { display: flex; gap: 22px; } .hx-kpis.is-inline b { font-size: 15px; }
.hx-hstrip { display: flex; align-items: flex-end; gap: 10px; margin-top: 12px; padding-top: 10px; border-top: 1px solid #eef1f5; }
.hx-hstrip > span { display: flex; flex-direction: column; align-items: center; gap: 3px; } .hx-hstrip small { color: var(--ink-3); font-size: 10.5px; text-transform: capitalize; }
.hx-hstrip .is-today small { color: var(--blue); font-weight: 600; }
.hx-hlbl { align-self: center!important; color: var(--ink-2); font-weight: 600; font-size: 12px; }
.hx-hnow { margin-left: auto; align-self: center!important; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.hx-pace { position: relative; display: block; height: 7px; background: #efeafd; border-radius: 99px; margin: 7px 0 3px; }
.hx-pace i { display: block; height: 100%; background: #6d28d9; border-radius: 99px; }
.hx-pace b { position: absolute; top: -4px; width: 2px; height: 15px; background: var(--ink); }
.hx-pace.is-lg { height: 9px; }
.hx-alert { margin-top: 10px; background: var(--red-soft); color: #8f1d1d; border-radius: 6px; padding: 5px 9px; font-size: 12.5px; }
.hx-txr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; min-height: 30px; border-bottom: 1px solid #eef1f5; }
.hx-txr:last-child { border-bottom: 0; }
.hx-num { font-family: var(--mono); font-size: 12px; }
.hx-wk { display: grid; grid-template-columns: 110px repeat(7, minmax(0, 1fr)); row-gap: 0; }
.hx-wk > b { font-size: 11.5px; font-weight: 500; color: var(--ink-3); padding: 0 4px 5px; text-transform: capitalize; }
.hx-wk > b.is-today { color: var(--blue); font-weight: 700; }
.hx-wl { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px; border-top: 1px solid #eef1f5; padding: 5px 0; }
.hx-wt { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 22px; gap: 3px 0; border-top: 1px solid #eef1f5; padding: 4px 0; background: linear-gradient(90deg, #f3f7ff 0 calc(100% / 7), transparent calc(100% / 7)); }
.hx-wb { margin: 0 2px; padding: 0 7px; border-radius: 5px; font-size: 11.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: color-mix(in srgb, var(--c) 13%, #fff); border-left: 3px solid var(--c); line-height: 22px; }
.hx-wb.is-ms { background: none; border-left: 0; color: color-mix(in srgb, var(--c) 75%, #000); font-weight: 600; }
.hx-wb.is-sport { --c: #0e7490; grid-row: 1; }

/* Journée : cadran au centre */
.hx-jgrid { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(400px, 480px) minmax(300px, 1fr); gap: 16px; align-items: start; }
.hx-fil { list-style: none; margin: 0; padding: 0 0 0 4px; border-left: 2px solid var(--line); }
.hx-fil li { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 8px; padding: 4px 0 6px 12px; }
.hx-fil li::before { content: ""; position: absolute; left: -7px; top: 9px; width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--line-2)); border: 2px solid #fff; }
.hx-fil time { font-family: var(--mono); font-size: 12px; color: var(--ink-2); padding-top: 1px; }
.hx-fil button, .hx-fil span { font-weight: 600; }
.hx-fil small { grid-column: 2; color: var(--ink-3); font-size: 12px; }
.hx-fil .is-past { opacity: .55; }
.hx-fil .hx-now { padding: 2px 0 4px 12px; } .hx-fil .hx-now::before { background: var(--red); border-radius: 50%; }
.hx-fil .hx-now time, .hx-fil .hx-now span { color: var(--red); font-size: 12px; }
.hx-dialwrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 8px 12px 12px; }
.hx-dialwrap .hx-dial { width: 100%; height: auto; display: block; }
.hx-hr { font-family: var(--mono); font-size: 10.5px; fill: #8796aa; }
.hx-cnum { font-family: var(--sans); font-size: 20px; font-weight: 700; fill: var(--ink); }
.hx-cden { font-weight: 500; fill: var(--ink-3); font-size: 15px; }
.hx-csub { font-size: 11.5px; fill: var(--ink-3); }
.hx-mini .hx-cnum { font-size: 13px; } .hx-mini .hx-cden { font-size: 11px; }
.hx-arc { cursor: pointer; } .hx-arc:hover { opacity: .75; }
.hx-seg, .hx-pc { transition: opacity .15s; }
#hx-app.has-hot .hx-dial .hx-seg:not(.is-hot), #hx-app.has-hot .hx-dial .hx-pc:not(.is-hot) { opacity: .25; }
.hx-legend { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; font-size: 11.5px; color: var(--ink-2); }
.hx-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; } .hx-legend small { color: var(--ink-3); }

/* Habitudes (style Habit Pixel) */
.hx-habits { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px 14px; }
.hx-dnav { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--blue); }
.hx-dnav button { width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 5px; text-align: center; color: var(--ink-3); }
.hx-theme { padding: 6px 0 4px; border-top: 1px solid #eef1f5; }
.hx-thead { display: flex; align-items: center; gap: 7px; padding: 2px 0 4px; }
.hx-thead i { width: 9px; height: 9px; border-radius: 2px; background: var(--t); }
.hx-thead span { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.hx-thead small { margin-left: auto; color: var(--ink-3); font-size: 11.5px; }
.hx-hrow { display: grid; grid-template-columns: minmax(0, 1fr) auto 34px; align-items: center; gap: 8px; min-height: 28px; padding: 0 4px 0 16px; border-radius: 6px; position: relative; }
.hx-hrow::before { content: ""; position: absolute; left: 4px; top: 50%; width: 7px; height: 1.5px; background: color-mix(in srgb, var(--t) 50%, #fff); }
.hx-hrow.is-hot { background: color-mix(in srgb, var(--t) 8%, #fff); }
.hx-hname small { color: var(--ink-3); }
.hx-hrow.is-na .hx-hname { color: var(--ink-3); text-decoration: line-through; }
.hx-box { width: 18px; height: 18px; border: 1.5px solid #b9c4d2; border-radius: 4px; display: grid; place-items: center; color: #fff; font-size: 11px; text-align: center; }
.hx-box.is-on { background: var(--t); border-color: var(--t); }
.hx-step { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 99px; padding: 1px 3px; }
.hx-step button { width: 20px; height: 20px; border-radius: 50%; text-align: center; color: var(--ink-2); }
.hx-step button:hover { background: var(--soft); }
.hx-step b { font-family: var(--mono); font-size: 12px; font-weight: 500; }
.hx-na { font-family: var(--mono); font-size: 11px; color: var(--ink-3); border: 1px solid transparent; border-radius: 4px; padding: 0 4px; text-align: center; }
.hx-na:hover { border-color: var(--line); } .hx-na.is-on { background: #eef1f5; color: var(--ink); border-color: var(--line-2); }
.hx-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #eef1f5; }
.hx-week > span { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; border: 1px solid var(--line); border-radius: 7px; }
.hx-week > span.is-today { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-soft); }
.hx-week b { font-size: 10.5px; font-weight: 600; text-transform: capitalize; } .hx-week small { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }

/* Partition */
.hx-seg { display: flex; border: 1px solid var(--line-2); border-radius: var(--r-ctl); overflow: hidden; }
.hx-seg button { padding: 5px 12px; color: var(--ink-2); font-weight: 500; } .hx-seg button + button { border-left: 1px solid var(--line-2); }
.hx-seg button[aria-pressed="true"] { background: var(--ink); color: #fff; } .hx-seg button:disabled { color: var(--ink-3); cursor: default; }
.hx-partition { padding: 0; overflow-x: auto; }
.hx-prow { display: grid; grid-template-columns: 180px minmax(0, 1fr); border-top: 1px solid var(--line); min-width: 980px; }
.hx-phead { grid-template-columns: 180px repeat(9, minmax(0, 1fr)); border-top: 0; font-size: 12px; color: var(--ink-3); }
.hx-phead > span { padding: 8px 12px; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.hx-phead b { padding: 8px 6px; font-weight: 500; text-transform: capitalize; } .hx-phead strong { color: var(--ink); font-size: 14px; margin-left: 2px; }
.hx-phead b.is-today strong { color: #fff; background: var(--blue); border-radius: 4px; padding: 0 5px; }
.hx-plh { border-left: 3px solid var(--c); padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; background: var(--soft); }
.hx-plh:hover { background: #eef3fb; } .hx-plh b { font-weight: 600; } .hx-plh small { color: var(--ink-3); font-size: 11.5px; } .hx-plh em { color: var(--red); font-style: normal; }
.hx-ptrack { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); grid-auto-rows: minmax(26px, auto); row-gap: 3px; padding: 6px 0; min-height: 50px; background: linear-gradient(90deg, transparent calc((var(--today) - 1) / var(--n) * 100%), #f3f7ff calc((var(--today) - 1) / var(--n) * 100%), #f3f7ff calc(var(--today) / var(--n) * 100%), transparent calc(var(--today) / var(--n) * 100%)), repeating-linear-gradient(90deg, transparent 0 calc(100% / var(--n) - 1px), #f0f2f6 calc(100% / var(--n) - 1px) calc(100% / var(--n))); }
.hx-note { margin: 0 3px; padding: 0 8px; border-radius: 5px; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 10%, #fff); color: color-mix(in srgb, var(--c) 72%, #000); font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 24px; }
.hx-note:hover { background: color-mix(in srgb, var(--c) 20%, #fff); }
.hx-note.is-late { border-style: dashed; } .hx-note.is-ms { border-radius: 99px; }
.hx-lateflag { grid-column: 1 / 4; font-size: 11.5px; color: var(--red); font-weight: 600; padding-left: 6px; align-self: center; }
.hx-dc { grid-row: 1; display: flex; flex-direction: column; gap: 3px; padding: 0 6px; font-size: 11.5px; color: var(--ink-2); }
.hx-dcl { display: flex; align-items: center; gap: 5px; } .hx-dcl small { font-family: var(--mono); }
