ès</text><text x="276" y="308" font-size="10.5" fill="#3B3B3B" font-family="monospace">#1E7A46</text><rect x="408" y="232" width="122" height="46" rx="4" fill="#9A7000" stroke="#D9D9D6"/><text x="408" y="294" font-size="10.5" fill="#111111">Avertissement</text><text x="408" y="308" font-size="10.5" fill="#3B3B3B" font-family="monospace">#9A7000</text><rect x="540" y="232" width="122" height="46" rx="4" fill="#DD1D21" stroke="#D9D9D6"/><text x="540" y="294" font-size="10.5" fill="#111111">Danger</text><text x="540" y="308" font-size="10.5" fill="#3B3B3B" font-family="monospace">#DD1D21</text><rect x="672" y="232" width="122" height="46" rx="4" fill="#FFFFFF" stroke="#D9D9D6"/><text x="672" y="294" font-size="10.5" fill="#111111">Navigation — fond</text><text x="672" y="308" font-size="10.5" fill="#3B3B3B" font-family="monospace">#FFFFFF</text><rect x="12" y="324" width="122" height="46" rx="4" fill="#111111" stroke="#D9D9D6"/><text x="12" y="386" font-size="10.5" fill="#111111">Navigation — texte</text><text x="12" y="400" font-size="10.5" fill="#3B3B3B" font-family="monospace">#111111</text><rect x="144" y="324" width="122" height="46" rx="4" fill="#FFD02A" stroke="#D9D9D6"/><text x="144" y="386" font-size="10.5" fill="#111111">Navigation — actif</text><text x="144" y="400" font-size="10.5" fill="#3B3B3B" font-family="monospace">#FFD02A</text><rect x="276" y="324" width="122" height="46" rx="4" fill="#111111" stroke="#D9D9D6"/><text x="276" y="386" font-size="10.5" fill="#111111">Info-bulle, aplat d&#39;encre</text><text x="276" y="400" font-size="10.5" fill="#3B3B3B" font-family="monospace">#111111</text><rect x="408" y="324" width="122" height="46" rx="4" fill="#DD1D21" stroke="#D9D9D6"/><text x="408" y="386" font-size="10.5" fill="#111111">Anneau de focus</text><text x="408" y="400" font-size="10.5" fill="#3B3B3B" font-family="monospace">#DD1D21</text><rect x="540" y="324" width="122" height="46" rx="4" fill="#FFD02A" stroke="#D9D9D6"/><text x="540" y="386" font-