<title>Rucher · Veillée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ink:#2a1d0e;--ink2:#6b5334;--cream:#fff8ea;--cream2:#f6ead0;--line:#e6d3ad;--amber:#e39b1f;--amber-d:#b8740c;
  --blue:#245edb;--late:#DC2626;--shadow:0 6px 22px rgba(60,35,5,.22);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#f3c888;color:var(--ink);font-size:14px;overflow:hidden}
button,input{font:inherit;color:inherit}
.wrap{position:relative;height:100%;overflow:hidden}
#map{position:absolute;inset:0}
.rucher-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rucher-label{position:absolute;left:0;top:0;white-space:nowrap;visibility:hidden}
.rucher-label--project{background:var(--ink);color:var(--cream);border-radius:999px;padding:4px 11px 4px 6px;font-weight:700;font-size:12.5px;display:flex;gap:7px;align-items:center;box-shadow:var(--shadow)}
.rucher-label--project .rl-dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px var(--cream)}
.rucher-label--project .rl-meta{font-weight:500;opacity:.8;font-size:11.5px}
.rucher-label--task{background:var(--cream);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:3px 9px;font-size:12px;font-weight:600;max-width:210px;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.rucher-label--task.is-selected{border-color:var(--amber);background:#fff}
.rucher-label--task.is-near{border-color:var(--amber)}
.rl-state{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px #c9b58d;flex:none}
.rl-state--doing{background:#f5b82e}.rl-state--done{background:var(--amber-d)}.rl-state--waiting{background:#9d8fc2}.rl-state--info{background:#a3a3a3}
.rl-stack{color:var(--amber-d)}
.fict{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 6px) 16px 6px;font-size:11.5px;background:rgba(42,29,14,.72);color:#ffe9bd;text-align:center}
.fict b{color:#fff}
.top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 30px);display:flex;gap:8px;align-items:flex-start;padding:0 12px;pointer-events:none}
.top>*{pointer-events:auto}
.hives{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 6px;flex:1;min-width:0}
.hive{flex:none;width:54px;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.hive .ring{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--amber) calc(var(--p)*1%),rgba(255,248,234,.55) 0);box-shadow:var(--shadow)}
.hive .core{width:38px;height:38px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-size:18px;border:3px solid var(--c)}
.hive small{font-size:10.5px;font-weight:700;color:var(--ink);background:rgba(255,248,234,.85);border-radius:6px;padding:0 4px;max-width:54px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hive:focus-visible .ring{outline:3px solid #fff;outline-offset:2px}
.hive.visited .core::after{content:'';}
.round{width:44px;height:44px;border-radius:50%;border:0;background:var(--cream);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;flex:none}
.round:focus-visible,.act:focus-visible,.sheet button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.stats{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 104px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.stat{background:rgba(255,248,234,.94);border-radius:12px;padding:6px 10px;box-shadow:var(--shadow);font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.stat b{font-size:16px;font-weight:800}
.stat small{font-weight:500;color:var(--ink2);font-size:11px;max-width:150px}
.r-joy{position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:124px;height:124px;border-radius:50%;background:rgba(255,248,234,.45);border:2px solid rgba(255,248,234,.8);touch-action:none}
.r-joy-knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--cream);box-shadow:var(--shadow)}
.acts{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:grid;grid-template-columns:auto auto;gap:10px;align-items:end}
.act{width:78px;height:78px;border-radius:50%;border:0;background:var(--amber);color:#fff;font-weight:800;font-size:15px;box-shadow:var(--shadow);cursor:pointer;grid-row:span 2}
.act[disabled]{background:#c9b58d;cursor:default}
.act span{display:block;font-size:10.5px;font-weight:600;opacity:.9}
.near{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 160px);background:var(--cream);border-radius:12px;padding:7px 12px;box-shadow:var(--shadow);font-weight:600;font-size:13px;max-width:calc(100% - 48px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--cream);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(60,35,5,.25);max-height:64%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;max-width:560px;margin:0 auto}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px}
.sheet-b{overflow:auto;padding:6px 18px 18px}
.sheet .x{position:absolute;right:10px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--cream2);cursor:pointer;font-size:18px}
.rd-project{display:flex;gap:7px;align-items:center;font-weight:700;color:var(--ink2);font-size:13px;padding-right:40px}
.rd-folder{font-weight:500}
.rd-dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.rd-title{font-size:19px;font-weight:800;line-height:1.25;margin:6px 0 10px;text-wrap:balance}
.rd-ms{color:#6b4ce6}
.rd-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rd-chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.rd-chip i{width:8px;height:8px;border-radius:50%}
.rd-chip--crit{border-color:var(--c);color:var(--c)}
.rd-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 12px;font-size:13.5px}
.rd-grid dt{color:var(--ink2)}.rd-grid dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.is-late{color:var(--late)}
.rd-bar{display:inline-block;width:100px;height:8px;border-radius:4px;background:var(--cream2);overflow:hidden}
.rd-bar span{display:block;height:100%;background:var(--amber)}
.rd-desc{color:var(--ink2);font-size:13.5px;line-height:1.5;margin:0 0 12px}
.rd-links{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.rd-link{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600}
.rd-arrow{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;flex:none}
.rd-arrow--in{background:#ece7fd;color:#5b3fd0}.rd-arrow--out{background:#fde7cf;color:#9a4d08}
.rd-world{font-size:12.5px;color:var(--ink2);margin:0 0 14px;background:var(--cream2);border-radius:10px;padding:8px 10px}
.rd-actions{display:grid;grid-template-columns:1fr auto;gap:8px}
.rd-btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--cream2)}
.rd-btn--primary{background:var(--blue);color:#fff}
.find{position:absolute;inset:0;background:rgba(42,29,14,.5);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 90px) 16px 16px;z-index:30}
.find-box{background:var(--cream);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:420px;padding:12px}
.find-box input{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:15px}
.find-box ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.find-box li button{width:100%;text-align:left;border:0;background:#fff;border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:600}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.r-toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 100px);transform:translateX(-50%);background:var(--ink);color:var(--cream);border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow);transition:opacity .4s;z-index:40;max-width:calc(100% - 32px)}
.r-toast.is-out{opacity:0}
.rf{padding:110px 16px 16px;overflow:auto;height:100%;box-sizing:border-box}
.rf-proj{background:var(--cream);border-radius:12px;margin-bottom:8px;padding:10px 12px}
.rf button{border:0;background:none;color:var(--blue);cursor:pointer}
@media (min-width:900px){ .sheet{left:auto;right:16px;bottom:16px;border-radius:20px;width:400px;max-height:calc(100% - 140px)} .grab{display:none} }
@media (prefers-reduced-motion:reduce){.r-toast{transition:none}}
</style>

<div class="wrap" id="stage">
  <div id="map"></div>
  <div class="fict" role="note"><b>Maquette C · Veillée</b> · Données fictives</div>
  <div class="top">
    <nav class="hives" id="hives" aria-label="Ruches des projets"></nav>
    <button class="round" type="button" id="find-b" aria-label="Chercher un projet et filtrer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2a1d0e" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </div>
  <div class="stats" aria-live="polite">
    <div class="stat">🍯 <b id="nectar">0</b><small>nectar butiné · ne modifie aucune tâche</small></div>
    <div class="stat">🧭 <b id="visited">0</b>/<span id="nterr">0</span><small>ruches visitées</small></div>
  </div>
  <div class="near" id="near" hidden></div>
  <div class="r-joy" id="joy" aria-hidden="true"><div class="r-joy-knob"></div></div>
  <div class="acts">
    <button class="round" type="button" id="recenter" aria-label="Recentrer sur l'apiculteur"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2a1d0e" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <button class="act" type="button" id="read" disabled>Lire<span>Entrée</span></button>
    <button class="round" type="button" id="overview" aria-label="Vue d'ensemble"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2a1d0e" stroke-width="2.2" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg></button>
  </div>
  <section class="sheet" id="sheet" aria-label="Détail de la tâche" hidden>
    <div class="grab"></div>
    <button class="x" type="button" id="close" aria-label="Fermer">×</button>
    <div class="sheet-b" id="sheet-b"></div>
  </section>
  <div class="find" id="find" hidden>
    <div class="find-box" role="dialog" aria-label="Chercher et filtrer">
      <input id="q" type="search" placeholder="Nom du projet…" autocomplete="off" aria-label="Nom du projet">
      <ul id="res"></ul>
      <div class="chipbar" role="group" aria-label="Filtres">
        <button class="fchip" type="button" data-f="all" aria-pressed="true">Tout</button>
        <button class="fchip" type="button" data-f="open" aria-pressed="false">Ouvertes</button>
        <button class="fchip" type="button" data-f="late" aria-pressed="false">En retard</button>
        <button class="fchip" type="button" data-f="urgent" aria-pressed="false">Urgentes</button>
        <button class="fchip" type="button" data-f="doing" aria-pressed="false">En cours</button>
      </div>
    </div>
  </div>
</div>
<!--THREE-->
<!--INLINE-->
<script>
(function(){
  var UI=window.RucherUI, data=UI.index(window.RucherNormalize(window.RUCHER_DEMO));
  var stage=document.getElementById('stage'), map=document.getElementById('map');
  if(!window.THREE||!RucherEngine.webglAvailable()){ map.innerHTML=UI.fallbackHTML(data); return; }
  var visited={}, engine;
  var style={sky:'#f4c98c',fogNear:26,fogFar:95,pitch:0.78,dist:15,minDist:6,maxDist:70,light:'#ffc98a',sun:2.4,ambient:1.3,skyLight:0xffe2b8,groundLight:0x7a5a3a,sunPos:[-40,22,10],
    water:'#3aa0b4',waterDeep:'#23708a',earth:'#8a5a34',earthDark:'#6e4527',
    biomes:{prairie:'#9ccf4c',lavande:'#a98ad8',verger:'#7cc25a',bruyere:'#d7869f',tournesol:'#f1c23a',foret:'#4f9446',forest:'#43853f',lake:'#9ccf4c',mountain:'#a08f80'},
    wild:'#b3cf62',mountain:'#9a8878',snow:'#fff1dc',path:'#e7b575',tint:0.06};
  try{ engine=RucherEngine.create(map,{data:data,style:style,quality:'high',onSelect:show,onNear:near,
    onNectar:function(c){document.getElementById('nectar').textContent=c;},
    onProject:function(pid){visit(pid);UI.toast(stage,data.projectById[pid].name+' · '+hiveText(pid));}}); }
  catch(e){ map.innerHTML=UI.fallbackHTML(data); return; }
  window.__engine=engine;
  var st=engine.stats();
  function hiveText(pid){var s=st[pid];return 'miel '+s.done+'/'+s.total+' · '+s.todo+' fleurs · '+s.doing+' en cours';}
  document.getElementById('nterr').textContent=data.projects.length;
  document.getElementById('hives').innerHTML=data.projects.map(function(p){var s=st[p.id];var pc=s.total?Math.round(s.done/s.total*100):0;
    return '<button type="button" class="hive" data-pid="'+UI.esc(p.id)+'" style="--p:'+pc+';--c:'+UI.esc(p.color)+'" aria-label="'+UI.esc(p.name)+', miel '+s.done+' sur '+s.total+'"><span class="ring"><span class="core">'+UI.esc(p.icon||'')+'</span></span><small>'+UI.esc(p.name)+'</small></button>';}).join('');
  document.getElementById('hives').onclick=function(e){var b=e.target.closest('[data-pid]');if(!b)return;engine.focusProject(b.dataset.pid);visit(b.dataset.pid);};
  function visit(pid){visited[pid]=1;document.getElementById('visited').textContent=Object.keys(visited).length;}
  function near(id){var n=document.getElementById('near'),r=document.getElementById('read');r.disabled=!id;if(!id){n.hidden=true;return;}n.hidden=false;n.textContent=data.taskById[id].title;visit(data.taskById[id].projectId);}
  function show(id){var s=document.getElementById('sheet');if(!id){s.hidden=true;return;}document.getElementById('sheet-b').innerHTML=UI.detailHTML(data.taskById[id],data);s.hidden=false;}
  document.getElementById('read').onclick=function(){var id=engine.nearTask();if(id)engine.select(id);};
  document.getElementById('close').onclick=function(){engine.select(null);};
  document.getElementById('recenter').onclick=function(){engine.recenter();};
  document.getElementById('overview').onclick=function(){engine.overview();};
  stage.addEventListener('click',function(e){
    var b=e.target.closest('[data-open],[data-walk],[data-go]'); if(!b)return;
    if(b.dataset.open) UI.toast(stage,'Dans Nexora, ce bouton ouvre la fiche habituelle de la tâche (maquette).');
    if(b.dataset.walk){engine.walkToTask(b.dataset.walk);engine.select(null);}
    if(b.dataset.go){engine.walkToTask(b.dataset.go);engine.select(b.dataset.go);}
  });
  var find=document.getElementById('find'), q=document.getElementById('q'), res=document.getElementById('res');
  document.getElementById('find-b').onclick=function(){find.hidden=false;q.focus();};
  find.onclick=function(e){if(e.target===find)find.hidden=true;};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')find.hidden=true;if(e.key==='/'&&find.hidden){e.preventDefault();find.hidden=false;q.focus();}});
  q.oninput=function(){res.innerHTML=UI.searchProjects(data,q.value).map(function(p){return '<li><button type="button" data-pid="'+UI.esc(p.id)+'"><span class="rd-dot" style="background:'+UI.esc(p.color)+'"></span>'+UI.esc(p.name)+'</button></li>';}).join('');};
  res.onclick=function(e){var b=e.target.closest('[data-pid]');if(!b)return;engine.focusProject(b.dataset.pid);visit(b.dataset.pid);find.hidden=true;q.value='';res.innerHTML='';};
  var sets={all:null,open:function(t){return t.state!=='done';},late:UI.makeFilter({late:true}),urgent:function(t){return t.criticality==='urgent';},doing:function(t){return t.state==='doing';}};
  document.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-f]').forEach(function(o){o.setAttribute('aria-pressed',o===b);});engine.setFilter(sets[b.dataset.f]);};});
  UI.joystick(document.getElementById('joy'),engine);
})();
</script>
